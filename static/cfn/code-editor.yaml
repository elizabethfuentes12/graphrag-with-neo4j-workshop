  CodeEditorInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref CodeEditorInstanceBootstrapRole

  CodeEditorInstance:
    Type: AWS::EC2::Instance
    DependsOn: Neo4jECSService
    Properties:
      ImageId: !If
        - IsGraviton
        - !FindInMap [ArmImage, !Ref InstanceOperatingSystem, ImageId]
        - !FindInMap [AmdImage, !Ref InstanceOperatingSystem, ImageId]
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnet1
      BlockDeviceMappings:
        - DeviceName: !If [IsAL2023, /dev/xvda, /dev/sda1]
          Ebs:
            VolumeSize: !Ref InstanceVolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true
      Monitoring: true
      SecurityGroupIds:
        - !Ref SecurityGroup
      IamInstanceProfile: !Ref CodeEditorInstanceProfile
      UserData:
        Fn::Base64: !Sub |
          #cloud-config
          hostname: ${InstanceName}
          bootcmd:
            # Disable automatic updates BEFORE they start (runs early in boot)
            - systemctl mask dnf-automatic.timer dnf-makecache.timer dnf-automatic-download.timer dnf-automatic-install.timer dnf-automatic-notifyonly.timer
            - systemctl stop dnf-automatic.timer dnf-makecache.timer 2>/dev/null || true
            - pkill -9 -f dnf || true
            - pkill -9 -f yum || true
          runcmd:
            # Create user first before any operations that need it
            - !Sub useradd -m -s /bin/bash ${CodeEditorUser} || true
            - !Sub mkdir -p ${HomeFolder} && chown -R ${CodeEditorUser}:${CodeEditorUser} ${HomeFolder}
            # Wait for any lingering DNF locks to clear
            - for i in {1..60}; do if ! fuser /var/lib/rpm/.rpm.lock /var/lib/rpm/Packages.db >/dev/null 2>&1; then break; fi; echo "Waiting for RPM lock... attempt $i"; sleep 2; done
            # Write AWS env vars
            - !Sub echo "AWS_REGION=${AWS::Region}" >> /etc/environment
            - !Sub echo "export AWS_REGION=${AWS::Region}" >> /home/${CodeEditorUser}/.bashrc
            # Configure Neo4j connection details for Fargate instance via NLB
            - !Sub echo "NEO4J_URI=bolt://${Neo4jNetworkLoadBalancer.DNSName}:7687" >> /etc/environment
            - !Sub echo "NEO4J_USER=neo4j" >> /etc/environment
            - !Sub echo "NEO4J_PASSWORD=$(aws secretsmanager get-secret-value --secret-id ${Neo4jPasswordSecret} --region ${AWS::Region} --query 'SecretString' --output text | python3 -c 'import sys,json; print(json.load(sys.stdin)[\"password\"])')" >> /etc/environment
            - !Sub echo "NEO4J_SECRET_ARN=${Neo4jPasswordSecret}" >> /etc/environment
            - !Sub echo "NEO4J_HOST=${Neo4jNetworkLoadBalancer.DNSName}" >> /etc/environment
            - !Sub echo "SECURITY_GROUP_ID=${Neo4jSecurityGroup}" >> /etc/environment
            - !Sub echo "SUBNET_IDS=${PublicSubnet1},${PublicSubnet2}" >> /etc/environment
            - !Sub echo "export NEO4J_URI=bolt://${Neo4jNetworkLoadBalancer.DNSName}:7687" >> /home/${CodeEditorUser}/.bashrc
            - !Sub echo "export NEO4J_USER=neo4j" >> /home/${CodeEditorUser}/.bashrc
            - !Sub echo "export NEO4J_PASSWORD=$(aws secretsmanager get-secret-value --secret-id ${Neo4jPasswordSecret} --region ${AWS::Region} --query 'SecretString' --output text | python3 -c 'import sys,json; print(json.load(sys.stdin)[\"password\"])')" >> /home/${CodeEditorUser}/.bashrc
            - !Sub echo "export NEO4J_SECRET_ARN=${Neo4jPasswordSecret}" >> /home/${CodeEditorUser}/.bashrc
            - !Sub echo "export NEO4J_HOST=${Neo4jNetworkLoadBalancer.DNSName}" >> /home/${CodeEditorUser}/.bashrc
            - !Sub echo "export SECURITY_GROUP_ID=${Neo4jSecurityGroup}" >> /home/${CodeEditorUser}/.bashrc
            - !Sub echo "export SUBNET_IDS=${PublicSubnet1},${PublicSubnet2}" >> /home/${CodeEditorUser}/.bashrc
      Tags:
      - Key: Name
        Value: !Ref InstanceName

  CodeEditorInstanceEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  ElasticIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt CodeEditorInstanceEIP.AllocationId
      InstanceId: !Ref CodeEditorInstance

  CodeEditorInstanceCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        DefaultTTL: 86400
        MaxTTL: 31536000
        MinTTL: 1
        Name: !Sub
        - ${InstanceName}-${RandomGUID}
        - RandomGUID: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId ]]]]
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: all
          EnableAcceptEncodingGzip: False
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers:
              - Accept-Charset
              - Authorization
              - Origin
              - Accept
              - Referer
              - Host
              - Accept-Language
              - Accept-Encoding
              - Accept-Datetime
          QueryStringsConfig:
            QueryStringBehavior: all

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: ElasticIPAssociation
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W10
            reason: CloudFront Distribution access logging would require setup of an S3 bucket and changes in IAM, which add unnecessary complexity to the template
          - id: W70
            reason: Workshop Studio does not include a domain that can be used to provision a certificate, so it is not possible to setup TLS. See PFR EE-6016
      checkov:
        skip:
          - id: CKV_AWS_68
            comment: Workshop CloudFront - WAF not required
          - id: CKV_AWS_86
            comment: Workshop CloudFront - access logging not required
          - id: CKV_AWS_174
            comment: Workshop CloudFront - TLS v1.2 minimum not enforceable without custom domain/certificate
    Properties:
      DistributionConfig:
        Enabled: True
        HttpVersion: http2and3
        CacheBehaviors:
          - AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # see https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-cache-policies.html#managed-cache-policy-caching-disabled
            Compress: False
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Managed-AllViewer - see https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-origin-request-policies.html#:~:text=When%20using%20AWS,47e4%2Db989%2D5492eafa07d3
            TargetOriginId: !Sub CloudFront-${AWS::StackName}
            ViewerProtocolPolicy: redirect-to-https
            PathPattern: '/proxy/*'
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - PATCH
            - POST
            - DELETE
          CachePolicyId: !Ref CodeEditorInstanceCachePolicy
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Managed-AllViewer - see https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-origin-request-policies.html#:~:text=When%20using%20AWS,47e4%2Db989%2D5492eafa07d3
          TargetOriginId: !Sub CloudFront-${AWS::StackName}
          ViewerProtocolPolicy: redirect-to-https
        Origins:
          - DomainName: !GetAtt CodeEditorInstance.PublicDnsName
            Id: !Sub CloudFront-${AWS::StackName}
            CustomOriginConfig:
              # Code Editor server on EC2 listens on HTTP only (no TLS cert on instance).
              # CloudFront terminates TLS — viewer-to-CloudFront is HTTPS (redirect-to-https).
              OriginProtocolPolicy: http-only

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: Code Editor needs full internet access for package installation and S3 downloads
          - id: W40
            reason: Egress required for full workshop functionality (S3, package repos, Neo4j)
    Properties:
      GroupDescription: Security Group for Code Editor - CloudFront ingress and Neo4j egress
      VpcId: !Ref WorkshopVPC
      SecurityGroupIngress:
        - Description: Allow HTTP from com.amazonaws.global.cloudfront.origin-facing
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !FindInMap [AWSRegionsPrefixListID, !Ref 'AWS::Region', PrefixList]
      SecurityGroupEgress:
        - Description: Allow all outbound (S3, packages, internet)
          IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # Custom resource: on stack deletion, detach all ENIs from the workshop security group
  # so CloudFormation can delete it without the "has a dependent object" error.
  # This happens when workshop notebooks create Lambda functions in the VPC during the session.
  SecurityGroupCleanupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub lambda.${AWS::URLSuffix}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ENICleanup
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                Resource: "*"

  SecurityGroupCleanupLambda:
    Type: AWS::Lambda::Function
    DependsOn: SecurityGroupCleanupRole
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W58
            reason: Role has AWSLambdaBasicExecutionRole which includes CloudWatch Logs write permissions
          - id: W89
            reason: This cleanup Lambda does not need VPC access
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: One-time cleanup Lambda - reserved concurrency not required
          - id: CKV_AWS_116
            comment: One-time cleanup Lambda - DLQ not required
          - id: CKV_AWS_117
            comment: Cleanup Lambda does not need VPC access
          - id: W92
            reason: Reserved concurrency not needed for a one-time cleanup function
    Properties:
      Handler: index.handler
      Runtime: python3.12
      Timeout: 300
      Role: !GetAtt SecurityGroupCleanupRole.Arn
      Architectures: [arm64]
      Code:
        ZipFile: |
          import boto3
          import json
          import urllib.request

          def send(event, status, reason=''):
              body = json.dumps({'Status': status, 'Reason': reason,
                  'PhysicalResourceId': event.get('PhysicalResourceId', 'sg-cleanup'),
                  'StackId': event['StackId'], 'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'], 'Data': {}})
              req = urllib.request.Request(event['ResponseURL'],
                  data=body.encode(), method='PUT',
                  headers={'Content-Type': '', 'Content-Length': str(len(body))})
              urllib.request.urlopen(req)

          def handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      sg_id = event['ResourceProperties'].get('SecurityGroupId', '')
                      region = event['ResourceProperties'].get('Region', 'us-east-1')
                      if sg_id:
                          ec2 = boto3.client('ec2', region_name=region)
                          try:
                              enis = ec2.describe_network_interfaces(
                                  Filters=[{'Name': 'group-id', 'Values': [sg_id]}]
                              )['NetworkInterfaces']
                              for eni in enis:
                                  try:
                                      ec2.delete_network_interface(
                                          NetworkInterfaceId=eni['NetworkInterfaceId'])
                                  except Exception:
                                      pass
                          except Exception:
                              pass
                  send(event, 'SUCCESS')
              except Exception as e:
                  send(event, 'SUCCESS', str(e))

  SecurityGroupCleanup:
    Type: Custom::SecurityGroupENICleanup
    DependsOn: SecurityGroup
    Properties:
      ServiceToken: !GetAtt SecurityGroupCleanupLambda.Arn
      SecurityGroupId: !GetAtt SecurityGroup.GroupId
      Region: !Ref AWS::Region

  CodeEditorHealthCheckLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub lambda.${AWS::URLSuffix}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  CodeEditorHealthCheckLambda:
    Type: AWS::Lambda::Function
    DependsOn: CodeEditorHealthCheckLambdaRole
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W58
            reason: Warning incorrectly reported. The role associated with the Lambda function has the AWSLambdaBasicExecutionRole managed policy attached, which includes permission to write CloudWatch Logs. See https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AWSLambdaBasicExecutionRole.html
          - id: W89
            reason: CloudFormation custom function does not need the scaffolding of a VPC, to do so would add unnecessary complexity
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: CFN custom resource Lambda - reserved concurrency not required
          - id: CKV_AWS_116
            comment: CFN custom resource Lambda - DLQ not required
          - id: CKV_AWS_117
            comment: CFN custom resource Lambda does not need VPC access
          - id: CKV_AWS_173
            comment: Workshop Lambda - environment variables do not contain sensitive data
          - id: W92
            reason: CloudFormation custom function does not need reserved concurrent executions, to do so would add unnecessary complexity
    Properties:
      Description: Run health check on Code Editor instance
      Handler: index.lambda_handler
      Runtime: python3.12
      MemorySize: 128
      Timeout: 600
      Environment:
        Variables:
          RetrySleep: 3000
          AbortTimeRemaining: 5000
      Architectures:
        - arm64
      Role: !GetAtt CodeEditorHealthCheckLambdaRole.Arn
      Code:
        ZipFile: |
          import json
          import cfnresponse
          import logging
          import time
          import os
          import http.client
          from urllib.parse import urlparse

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def healthURLOk(url):
              # Using try block to catch connection errors and JSON conversion errors
              try:
                  logger.debug(f'url: {url}')
                  parsed_url = urlparse(url)
                  if parsed_url.scheme == 'https':
                      logger.debug(f'Trying https: {parsed_url.netloc}. Parsed_url: {parsed_url}')
                      conn = http.client.HTTPSConnection(parsed_url.netloc)
                  else:
                      logger.debug(f'Trying http: {parsed_url.netloc}. Parsed_url: {parsed_url}')
                      conn = http.client.HTTPConnection(parsed_url.netloc)
                  conn.request("GET", parsed_url.path or "/")
                  response = conn.getresponse()
                  logger.debug(f'response: {response}')
                  logger.debug(f'response.status: {response.status}')
                  content = response.read()
                  logger.debug(f'content: {content}')
                  # This will be true for any return code below 4xx (so 3xx and 2xx)
                  if 200 <= response.status < 400:
                      response_dict = json.loads(content.decode('utf-8'))
                      logger.debug(f'response_dict: {response_dict}')
                      # Checking for expected keys and if the key has the expected value
                      if 'hasActiveConnections' in response_dict:
                          # Response code 200 and correct JSON returned
                          logger.info('Health check OK.')
                          return True
                      else:
                          # Response code 200 but the 'hasActiveConnections' key is not present
                          logger.info(f'Health check failed. Response: {response_dict}')
                          return False
                  else:
                      # Response was not ok (error 4xx or 5xx)
                      logger.info(f'Healthcheck failed. Return code: {response.status}')
                      return False

              except http.client.HTTPException as e:
                  # URL malformed or endpoint not ready yet, this should only happen if we can not DNS resolve the URL
                  logger.error(e, exc_info=True)
                  logger.error(f'Healthcheck failed: HTTP Exception. URL invalid and/or endpoint not ready yet')
                  return False

              except json.decoder.JSONDecodeError as e:
                  # The response we got was not a properly formatted JSON
                  logger.error(e, exc_info=True)
                  logger.info(f'Healthcheck failed: Did not get JSON object from URL as expected')
                  return False

              except Exception as e:
                  logger.error(e, exc_info=True)
                  logger.info(f'Healthcheck failed: General error')
                  return False

              finally:
                  if 'conn' in locals():
                      conn.close()

          def is_valid_json(json_string):
              try:
                  json.loads(json_string)
                  return True
              except ValueError:
                  return False

          def lambda_handler(event, context):
              logger.debug(f'event: {event}')
              logger.debug(f'context: {context}')
              try:
                  if event['RequestType'] != 'Create':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData={}, reason='No action to take')
                  else:
                      sleep_ms = int(os.environ.get('RetrySleep'))
                      abort_time_remaining_ms = int(os.environ.get('AbortTimeRemaining'))
                      resource_properties = event['ResourceProperties']
                      url = resource_properties['Url']

                      logger.info(f'Testing url: {url}')

                      time_remaining_ms = context.get_remaining_time_in_millis()
                      attempt_no = 0
                      health_check = False
                      while (attempt_no == 0 or (time_remaining_ms > abort_time_remaining_ms and not health_check)):
                          attempt_no += 1
                          logger.info(f'Attempt: {attempt_no}. Time Remaining: {time_remaining_ms/1000}s')
                          health_check = healthURLOk(url)
                          if not health_check:
                              logger.debug(f'Healthcheck failed. Sleeping: {sleep_ms/1000}s')
                              time.sleep(sleep_ms/1000)
                          time_remaining_ms = context.get_remaining_time_in_millis()
                      if health_check:
                          logger.info(f'Health check successful. Attempts: {attempt_no}. Time Remaining: {time_remaining_ms/1000}s')
                          cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData={}, reason='Code Editor healthcheck successful')
                      else:
                          logger.info(f'Health check failed. Timed out. Attempts: {attempt_no}. Time remaining {time_remaining_ms/1000}s < Abort time remaining {abort_time_remaining_ms/1000}s')
                          cfnresponse.send(event, context, cfnresponse.FAILED, responseData={}, reason='Code Editor healthcheck failed. Timed out after ' + str(attempt_no) + ' attempts')
                          logger.info(f'Response sent')

              except Exception as e:
                  logger.error(e, exc_info=True)
                  logger.info(f'Health check failed. General exception')
                  cfnresponse.send(event, context, cfnresponse.FAILED, responseData={}, reason=str(e))

  Healthcheck:
