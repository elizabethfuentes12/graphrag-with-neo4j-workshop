AWSTemplateFormatVersion: "2010-09-09"
Description: "Create a Code Editor instance with an Amazon CloudFront distribution for use in Workshop Studio. Version 1.5.1"

Parameters:
  CodeEditorUser:
    Type: String
    Description: UserName for Code Editor
    Default: participant
  InstanceName:
    Type: String
    Description: Code Editor EC2 instance name
    Default: CodeEditor
  InstanceVolumeSize:
    Type: Number
    Description: Code Editor EC2 instance volume size in GB
    Default: 40
  InstanceType:
    Description: Code Editor EC2 instance type
    Type: String
    Default: m8g.large
  InstanceOperatingSystem:
    Description: Code Editor EC2 operating system
    Type: String
    Default: AmazonLinux-2023
    AllowedValues: ['AmazonLinux-2023', 'Ubuntu-22', 'Ubuntu-24']
  HomeFolder:
    Type: String
    Description: Folder to open in Code Editor
    Default: /workshop
  DevServerBasePath:
    Type: String
    Description: Base path for the application to be added to Nginx sites-available list
    Default: ''
  DevServerPort:
    Type: Number
    Description: Port for the DevServer
    Default: 8081
  RepoUrl:
    Description: Remote repo URL to clone. To not clone a remote repo, leave blank
    Type: String
    Default: ''
  AssetZipS3Path:
    Description: S3 path holding the asset zip file to be copied into the home folder. To not include any assets, leave blank
    Type: String
    Default: ''
  BranchZipS3Path:
    Description: S3 path holding the branches zip file to be checked into the git repo, with each folder being a branch. The content of each folder will added as under a branch, with the folder name being used as the branch name. To leave the empty, leave blank
    Type: String
    Default: ''
  FolderZipS3Path:
    Description: S3 path holding the folder zip file, with each folder being a subfolder of the home directory. Each folder will have its own local git repo. To not include any folders, leave blank
    Type: String
    Default: ''
  AssetsBucketName:
    Description: Workshop Studio S3 assets bucket name (used to download pre-built Neo4j graph dump)
    Type: String
    Default: ''
  AssetsBucketPrefix:
    Description: Workshop Studio S3 assets prefix with trailing slash
    Type: String
    Default: ''

Conditions:
  IsAL2023: !Equals [!Ref InstanceOperatingSystem, 'AmazonLinux-2023']
  IsGraviton: !Not [
    !Equals [
      !Select [0, !Split ['g', !Select [0, !Split ['.', !Ref InstanceType]]]],
      !Select [0, !Split ['.', !Ref InstanceType]]
    ]
  ]

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Instance Configuration
        Parameters:
          - InstanceName
          - InstanceVolumeSize
          - InstanceType
          - InstanceOperatingSystem
      - Label:
          default: Code Editor Configuration
        Parameters:
          - CodeEditorUser
          - HomeFolder
          - DevServerBasePath
          - DevServerPort
          - RepoUrl
          - AssetZipS3Path
          - BranchZipS3Path
          - FolderZipS3Path
    ParameterLabels:
      CodeEditorUser:
        default: Code Editor user name
      InstanceName:
        default: Instance name
      InstanceVolumeSize:
        default: Instance volume size
      InstanceType:
        default: Instance type
      InstanceOperatingSystem:
        default: Instance operating system
      HomeFolder:
        default: Code Editor home folder
      DevServerBasePath:
        default: Application base path
      DevServerPort:
        default: Application port
      RepoUrl:
        default: Git repo URL
      AssetZipS3Path:
        default: Asset file S3 path
      BranchZipS3Path:
        default: Branch file S3 path
      FolderZipS3Path:
        default: Folder file S3 path

Mappings:
  ArmImage:
  # aws ssm get-parameters-by-path --path "/aws/service/canonical/ubuntu/" --recursive --query "Parameters[*].Name"  > canonical-ami.txt
  # aws ssm get-parameters-by-path --path "/aws/service/ami-amazon-linux-latest/" --recursive --query "Parameters[*].Name"  > amazon-ami.txt
    Ubuntu-22:
      ImageId: '{{resolve:ssm:/aws/service/canonical/ubuntu/server/jammy/stable/current/arm64/hvm/ebs-gp2/ami-id}}'
    Ubuntu-24:
      ImageId: '{{resolve:ssm:/aws/service/canonical/ubuntu/server/noble/stable/current/arm64/hvm/ebs-gp3/ami-id}}'
    AmazonLinux-2023:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}'
  AmdImage:
    Ubuntu-22:
      ImageId: '{{resolve:ssm:/aws/service/canonical/ubuntu/server/jammy/stable/current/amd64/hvm/ebs-gp2/ami-id}}'
    Ubuntu-24:
      ImageId: '{{resolve:ssm:/aws/service/canonical/ubuntu/server/noble/stable/current/amd64/hvm/ebs-gp3/ami-id}}'
    AmazonLinux-2023:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
  AWSRegionsPrefixListID:
  # aws ec2 describe-managed-prefix-lists  --region <REGION> | jq -r '.PrefixLists[] | select (.PrefixListName == "com.amazonaws.global.cloudfront.origin-facing") | .PrefixListId'
    ap-northeast-1:
      PrefixList: pl-58a04531
    ap-northeast-2:
      PrefixList: pl-22a6434b
    ap-south-1:
      PrefixList: pl-9aa247f3
    ap-southeast-1:
      PrefixList: pl-31a34658
    ap-southeast-2:
      PrefixList: pl-b8a742d1
    ca-central-1:
      PrefixList: pl-38a64351
    eu-central-1:
      PrefixList: pl-a3a144ca
    eu-north-1:
      PrefixList: pl-fab65393
    eu-west-1:
      PrefixList: pl-4fa04526
    eu-west-2:
      PrefixList: pl-93a247fa
    eu-west-3:
      PrefixList: pl-75b1541c
    sa-east-1:
      PrefixList: pl-5da64334
    us-east-1:
      PrefixList: pl-3b927c52
    us-east-2:
      PrefixList: pl-b6a144df
    us-west-1:
      PrefixList: pl-4ea04527
    us-west-2:
      PrefixList: pl-82a045eb

Resources:
  # ============================================================================
  # VPC Infrastructure (shared by Code Editor EC2 and Neo4j Fargate)
  # ============================================================================

  WorkshopVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref WorkshopVPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref WorkshopVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref WorkshopVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-2

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref WorkshopVPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  SubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # ============================================================================
  # Secrets
  # ============================================================================

  CodeEditorSecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W77
            reason: The default KMS Key used by Secrets Manager is appropriate for this password which will be used to log into Code Editor, which has very limited permissions. In addition this secret will not be required to be shared across accounts
      checkov:
        skip:
          - id: CKV_AWS_149
            comment: Workshop secret - KMS CMK not required; uses AWS-managed key
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub
      - ${InstanceName}-${RandomGUID}
      - RandomGUID: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId ]]]]
      Description: Code Editor user details
      GenerateSecretString:
        PasswordLength: 16
        SecretStringTemplate: !Sub '{"username":"${CodeEditorUser}"}'
        GenerateStringKey: 'password'
        ExcludePunctuation: true

  Neo4jPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W77
            reason: The default KMS Key used by Secrets Manager is appropriate for this password which will be used for the local Neo4j instance
      checkov:
        skip:
          - id: CKV_AWS_149
            comment: Workshop secret - KMS CMK not required; uses AWS-managed key
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub
      - ${InstanceName}-neo4j-${RandomGUID}
      - RandomGUID: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId ]]]]
      Description: Neo4j connection details for participant instance
      GenerateSecretString:
        PasswordLength: 20
        ExcludePunctuation: true
        ExcludeCharacters: '"@/\\'
        GenerateStringKey: password
        SecretStringTemplate: '{"user":"neo4j"}'

  # ============================================================================
  # Neo4j Fargate Infrastructure
  # ============================================================================

  Neo4jSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: Code Editor EC2 and Lambda need to reach Neo4j on port 7687. VPC-only traffic.
          - id: W40
            reason: Egress required for downloading graph dump from S3 and container image from ECR.
    Properties:
      GroupDescription: Allow inbound Bolt protocol (7687) for Neo4j and HTTPS for VPC endpoints
      VpcId: !Ref WorkshopVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 7687
          ToPort: 7687
          CidrIp: 10.0.0.0/16
          Description: Neo4j Bolt protocol from VPC
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/16
          Description: HTTPS for VPC endpoints (Secrets Manager, Bedrock)
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound for S3 and ECR access

  # Self-referencing ingress rule for VPC Lambda connectivity
  # Must be separate resource to avoid circular dependency during creation
  Neo4jSecurityGroupSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref Neo4jSecurityGroup
      IpProtocol: tcp
      FromPort: 7687
      ToPort: 7687
      SourceSecurityGroupId: !Ref Neo4jSecurityGroup
      Description: Allow Neo4j access from VPC Lambdas in same security group

  # VPC Endpoints for Lambda to access AWS services without internet
  SecretsManagerVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref WorkshopVPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.secretsmanager
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroupIds:
        - !Ref Neo4jSecurityGroup

  BedrockRuntimeVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref WorkshopVPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.bedrock-runtime
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroupIds:
        - !Ref Neo4jSecurityGroup

  DynamoDBVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref WorkshopVPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.dynamodb
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PublicRouteTable

  Neo4jECSCluster:
    Type: AWS::ECS::Cluster
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_65
            comment: Workshop ECS cluster - container insights not required
    Properties:
      ClusterName: !Sub ${AWS::StackName}-neo4j

  Neo4jLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: CloudWatch Logs encryption with KMS adds unnecessary complexity for workshop
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: Workshop log group - KMS CMK encryption not required
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}-neo4j
      RetentionInDays: 7

  Neo4jTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref Neo4jPasswordSecret

  Neo4jTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3DumpAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${AssetsBucketName}
                  - !Sub arn:${AWS::Partition}:s3:::${AssetsBucketName}/${AssetsBucketPrefix}*
                  - !Sub
                    - arn:${AWS::Partition}:s3:::${AssetsBucketName}/${StaticPrefix}*
                    - StaticPrefix: !Join ['static/', !Split ['assets/', !Ref AssetsBucketPrefix]]

  Neo4jTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AWS::StackName}-neo4j
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '1024'
      Memory: '2048'
      ExecutionRoleArn: !GetAtt Neo4jTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt Neo4jTaskRole.Arn
      Volumes:
        - Name: neo4j-data
      ContainerDefinitions:
        - Name: init-download
          Image: amazon/aws-cli
          Essential: false
          EntryPoint:
            - sh
            - -c
          Command:
            - |
              # AssetsBucketPrefix = "WORKSHOP-ID/assets/" but Workshop Studio uploads files from /static to "WORKSHOP-ID/static/"
              # Replace "assets/" with "static/" in the prefix
              STATIC_PREFIX=$(echo "${ASSETS_PREFIX}" | sed 's|assets/|static/|')
              DUMP_PATH="s3://${ASSETS_BUCKET}/${STATIC_PREFIX}neo4j-hotel-graph.dump"
              if aws s3 ls "$DUMP_PATH" 2>/dev/null; then
                echo "Downloading Neo4j database dump from S3..."
                aws s3 cp "$DUMP_PATH" /data/neo4j.dump
                echo "Download complete"
                exit 0
              else
                echo "ERROR: No database dump found at $DUMP_PATH"
                echo "The Neo4j task cannot start without the pre-built database dump."
                exit 1
              fi
          Environment:
            - Name: ASSETS_BUCKET
              Value: !Ref AssetsBucketName
            - Name: ASSETS_PREFIX
              Value: !Ref AssetsBucketPrefix
          MountPoints:
            - SourceVolume: neo4j-data
              ContainerPath: /data
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Neo4jLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: init-download
        - Name: neo4j
          Image: neo4j:2026.03.1-community
          Essential: true
          DependsOn:
            - ContainerName: init-download
              Condition: SUCCESS
          MountPoints:
            - SourceVolume: neo4j-data
              ContainerPath: /tmp/import
          PortMappings:
            - ContainerPort: 7687
              Protocol: tcp
            - ContainerPort: 7474
              Protocol: tcp
          Environment:
            - Name: NEO4J_PLUGINS
              Value: '["apoc"]'
            - Name: NEO4J_server_memory_heap_initial__size
              Value: 512m
            - Name: NEO4J_server_memory_heap_max__size
              Value: 1G
            - Name: ASSETS_BUCKET
              Value: !Ref AssetsBucketName
            - Name: ASSETS_PREFIX
              Value: !Ref AssetsBucketPrefix
            - Name: WORKSHOP_NEO4J_PASSWORD
              Value: !Sub '{{resolve:secretsmanager:${Neo4jPasswordSecret}}}'
          Command:
            - /bin/bash
            - -c
            - |
              # Extract password from JSON secret (format: {"password":"...", "user":"..."})
              PASSWORD=$(echo "${WORKSHOP_NEO4J_PASSWORD}" | sed 's/.*"password":"\([^"]*\)".*/\1/')
              export NEO4J_AUTH="neo4j/${PASSWORD}"

              # Load database if downloaded by init container
              if [ -f /tmp/import/neo4j.dump ]; then
                echo "Loading Neo4j database from dump file..."
                neo4j-admin database load neo4j \
                  --from-path=/tmp/import \
                  --overwrite-destination=true
                echo "✓ Database loaded successfully"
                chown -R neo4j:neo4j /var/lib/neo4j
              else
                echo "No pre-built database found. Starting with empty database."
              fi

              # Start Neo4j
              exec /startup/docker-entrypoint.sh neo4j
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Neo4jLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: neo4j

  Neo4jNetworkLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_91
            comment: Workshop NLB - access logging not required
    Properties:
      Type: network
      Scheme: internal
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-neo4j-nlb

  Neo4jTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Protocol: TCP
      Port: 7687
      VpcId: !Ref WorkshopVPC
      TargetType: ip
      HealthCheckProtocol: TCP
      HealthCheckPort: 7687
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2

  Neo4jListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Neo4jNetworkLoadBalancer
      Protocol: TCP
      Port: 7687
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref Neo4jTargetGroup

  Neo4jECSService:
    Type: AWS::ECS::Service
    DependsOn: Neo4jListener
    Properties:
      Cluster: !Ref Neo4jECSCluster
      TaskDefinition: !Ref Neo4jTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MaximumPercent: 200
        MinimumHealthyPercent: 0
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref Neo4jSecurityGroup
      LoadBalancers:
        - ContainerName: neo4j
          ContainerPort: 7687
          TargetGroupArn: !Ref Neo4jTargetGroup
      HealthCheckGracePeriodSeconds: 600

  # ============================================================================
  # Lambda Custom Resources
  # ============================================================================

  UpdateNeo4jSecretLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub lambda.${AWS::URLSuffix}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: UpdateSecretsManager
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:UpdateSecret
                Resource: !Ref Neo4jPasswordSecret

  UpdateNeo4jSecretLambda:
    Type: AWS::Lambda::Function
    DependsOn: UpdateNeo4jSecretLambdaRole
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W58
            reason: Warning incorrectly reported. The role has AWSLambdaBasicExecutionRole which includes CloudWatch Logs permissions
          - id: W89
            reason: CloudFormation custom function does not need VPC access
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: CFN custom resource Lambda - reserved concurrency not required
          - id: CKV_AWS_116
            comment: CFN custom resource Lambda - DLQ not required
          - id: CKV_AWS_117
            comment: CFN custom resource Lambda does not need VPC access
          - id: CKV_SECRET_6
            comment: Inline Python script contains no real secrets - false positive from high-entropy code patterns
          - id: W92
            reason: CloudFormation custom function does not need reserved concurrent executions
    Properties:
      Description: Update Neo4j secret with connection details after NLB is created
      Handler: index.lambda_handler
      Runtime: python3.12
      MemorySize: 128
      Timeout: 30
      Architectures:
        - arm64
      Role: !GetAtt UpdateNeo4jSecretLambdaRole.Arn
      Code:
        ZipFile: |
          import boto3
          import json
          import cfnresponse
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def lambda_handler(event, context):
              logger.info(f'Event: {json.dumps(event)}')
              try:
                  if event['RequestType'] == 'Delete':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData={}, reason='No action needed on delete')
                      return

                  props = event['ResourceProperties']
                  secret_id = props['SecretId']
                  nlb_dns = props['NLBDnsName']

                  secrets_client = boto3.client('secretsmanager')

                  # Get current secret (contains password)
                  response = secrets_client.get_secret_value(SecretId=secret_id)
                  current_secret = json.loads(response['SecretString'])
                  password = current_secret.get('password', '')

                  # Update with full connection details
                  updated_secret = {
                      'user': 'neo4j',
                      'password': password,
                      'host': nlb_dns,
                      'uri': f'bolt://{nlb_dns}:7687'
                  }

                  secrets_client.put_secret_value(
                      SecretId=secret_id,
                      SecretString=json.dumps(updated_secret)
                  )

                  logger.info(f'Updated secret {secret_id} with Neo4j connection details')
                  cfnresponse.send(event, context, cfnresponse.SUCCESS,
                                   responseData={'SecretArn': secret_id},
                                   reason='Secret updated successfully')

              except Exception as e:
                  logger.error(f'Error: {str(e)}')
                  cfnresponse.send(event, context, cfnresponse.FAILED,
                                   responseData={},
                                   reason=str(e))

  UpdateNeo4jSecret:
    Type: Custom::UpdateNeo4jSecret
    DependsOn: Neo4jNetworkLoadBalancer
    Properties:
      ServiceToken: !GetAtt UpdateNeo4jSecretLambda.Arn
      SecretId: !Ref Neo4jPasswordSecret
      NLBDnsName: !GetAtt Neo4jNetworkLoadBalancer.DNSName

  SecretPlaintextLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub lambda.${AWS::URLSuffix}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AwsSecretsManager
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref CodeEditorSecret

  SecretPlaintextLambda:
    Type: AWS::Lambda::Function
    DependsOn: SecretPlaintextLambdaRole
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W58
            reason: Warning incorrectly reported. The role associated with the Lambda function has the AWSLambdaBasicExecutionRole managed policy attached, which includes permission to write CloudWatch Logs. See https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AWSLambdaBasicExecutionRole.html
          - id: W89
            reason: CloudFormation custom function does not need the scaffolding of a VPC, to do so would add unnecessary complexity
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: CFN custom resource Lambda - reserved concurrency not required
          - id: CKV_AWS_116
            comment: CFN custom resource Lambda - DLQ not required
          - id: CKV_AWS_117
            comment: CFN custom resource Lambda does not need VPC access
          - id: CKV_SECRET_6
            comment: Inline Python script contains no real secrets - false positive from high-entropy code patterns
          - id: W92
            reason: CloudFormation custom function does not need reserved concurrent executions, to do so would add unnecessary complexity
    Properties:
      Description: Return the value of the secret
      Handler: index.lambda_handler
      Runtime: python3.12
      MemorySize: 128
      Timeout: 10
      Architectures:
        - arm64
      Role: !GetAtt SecretPlaintextLambdaRole.Arn
      Code:
        ZipFile: |
          import boto3
          import json
          import cfnresponse
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def is_valid_json(json_string):
              logger.debug(f'Calling is_valid_json:{json_string}')
              try:
                  json.loads(json_string)
                  logger.info(f'Secret is in json format')
                  return True
              except json.JSONDecodeError:
                  logger.info(f'Secret is in string format')
                  return False

          def lambda_handler(event, context):
              logger.debug(f'event: {event}')
              logger.debug(f'context: {context}')
              try:
                  if event['RequestType'] == 'Delete':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData={}, reason='No action to take')
                  else:
                      resource_properties = event['ResourceProperties']
                      secret_name = resource_properties['SecretArn']
                      secrets_mgr = boto3.client('secretsmanager')

                      logger.info(f'Getting secret from {secret_name}')

                      secret = secrets_mgr.get_secret_value(SecretId = secret_name)
                      logger.debug(f'secret: {secret}')
                      secret_value = secret['SecretString']

                      responseData = {}
                      if is_valid_json(secret_value):
                          responseData = secret_value
                      else:
                          responseData = {'secret': secret_value}
                      logger.debug(f'responseData: {responseData}')
                      logger.debug(f'type(responseData): {type(responseData)}')
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData=json.loads(responseData), reason='OK', noEcho=True)
              except Exception as e:
                  logger.error(e)
                  cfnresponse.send(event, context, cfnresponse.FAILED, responseData={}, reason=str(e))

  SecretPlaintext:
    Type: Custom::SecretPlaintextLambda
    Properties:
      ServiceToken: !GetAtt SecretPlaintextLambda.Arn
      ServiceTimeout: 15
      SecretArn: !Ref CodeEditorSecret

  InstallCodeEditorExtensionSSMDoc:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      Content:
        schemaVersion: '2.2'
        description: Install CodeEditor Extension
        parameters:
          ExtensionId:
            type: String
          CodeEditorUser:
            type: String
          MaxRetries:
            type: String
            default: '3'
          FailureReturnValue:
            type: String
            default: '0'
        mainSteps:
          - name: InstallCodeEditorExtension
            action: aws:runShellScript
            inputs:
              timeoutSeconds: 300
              runCommand:
                - '#!/bin/bash'
                - |
                  extension_name="{{ ExtensionId }}"
                  max_retries={{ MaxRetries }}
                  retry_count=0

                  while [ $retry_count -lt $max_retries ]; do
                    echo "Installing extension: $extension_name (attempt $((retry_count + 1))/$max_retries)"

                    if ! sudo -i -u {{ CodeEditorUser }} code-editor-server --install-extension "$extension_name" --force 2>&1; then
                      echo "Failed to install $extension_name on attempt $((retry_count + 1))"
                    fi

                    if sudo -i -u {{ CodeEditorUser }} code-editor-server --list-extensions | grep -qi "$extension_name"; then
                      echo "Successfully installed $extension_name"
                      exit 0
                    else
                      echo "Extension $extension_name not found in installed list"
                    fi

                    retry_count=$((retry_count + 1))
                    if [ $retry_count -lt $max_retries ]; then
                      echo "Retrying in 5 seconds..."
                      sleep 5
                    fi
                  done

                  echo "Failed to install $extension_name after $max_retries attempts"
                  exit {{ FailureReturnValue }}

  CodeEditorSSMDoc:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      Content:
        schemaVersion: '2.2'
        description: Bootstrap Code Editor instance
        parameters:
          LinuxFlavor:
            type: String
            default: 'al2023'
          CodeEditorPassword:
            type: String
            default: !Ref AWS::StackId
        # all mainSteps scripts are in in /var/lib/amazon/ssm/<instanceid>/document/orchestration/<uuid>/<StepName>/_script.sh
        mainSteps:
          # CloudWatch Agent disabled - not required for workshop functionality
          # - name: InstallCloudWatchAgent
          #   action: aws:configurePackage
          #   inputs:
          #     name: AmazonCloudWatchAgent
          #     action: Install
          # - name: ConfigureCloudWatchAgent
          #   action: aws:runDocument
          #   inputs:
          #     documentType: SSMDocument
          #     documentPath: AmazonCloudWatch-ManageAgent
          #     documentParameters:
          #       action: configure
          #       mode: ec2
          #       optionalConfigurationSource: default
          #       optionalRestart: 'yes'
          - name: InstallAptPackagesApt
            action: aws:runShellScript
            precondition:
              StringEquals:
                - '{{ LinuxFlavor }}'
                - ubuntu
            inputs:
              timeoutSeconds: 300
              runCommand:
                - '#!/bin/bash'
                - set -euo pipefail
                - dpkg --configure -a
                - apt-get -q update && DEBIAN_FRONTEND=noninteractive apt-get install -y -q apt-utils
                - apt-get -q update && DEBIAN_FRONTEND=noninteractive apt-get install -y -q needrestart unattended-upgrades
                - sed -i 's/#$nrconf{kernelhints} = -1;/$nrconf{kernelhints} = 0;/' /etc/needrestart/needrestart.conf
                - sed -i 's/#$nrconf{verbosity} = 2;/$nrconf{verbosity} = 0;/' /etc/needrestart/needrestart.conf
                - sed -i "s/#\$nrconf{restart} = 'i';/\$nrconf{restart} = 'a';/" /etc/needrestart/needrestart.conf
                - echo "Apt helper packages added. Checking configuration"
                - cat /etc/needrestart/needrestart.conf
          - name: InstallBasePackagesDnf
            action: aws:runShellScript
            precondition:
              StringEquals:
                - '{{ LinuxFlavor }}'
                - al2023
            inputs:
              timeoutSeconds: 300
              runCommand:
                - '#!/bin/bash'
                - set -euo pipefail
                - dnf install -y --allowerasing curl gnupg whois unzip nginx openssl jq
          - name: InstallBasePackagesApt
            action: aws:runShellScript
            precondition:
              StringEquals:
                - '{{ LinuxFlavor }}'
                - ubuntu
            inputs:
              timeoutSeconds: 300
              runCommand:
                - '#!/bin/bash'
                - set -euo pipefail
                - dpkg --configure -a
                - apt-get -q update && DEBIAN_FRONTEND=noninteractive apt-get install -y -q curl gnupg whois argon2 unzip nginx openssl locales locales-all apt-transport-https ca-certificates software-properties-common jq
          - name: AddUserDnf
            action: aws:runShellScript
            precondition:
              StringEquals:
                - '{{ LinuxFlavor }}'
                - al2023
            inputs:
              timeoutSeconds: 300
              runCommand:
                - '#!/bin/bash'
                - set -euo pipefail
                - !Sub |
                  if id "${CodeEditorUser}" &>/dev/null; then
                    echo 'User ${CodeEditorUser} already exists, skipping creation'
                  else
                    echo 'Adding user: ${CodeEditorUser}'
                    adduser -c '' ${CodeEditorUser}
                    passwd -l ${CodeEditorUser}
                  fi
                  echo "${CodeEditorUser}:{{ CodeEditorPassword }}" | chpasswd
                  usermod -aG wheel ${CodeEditorUser}
                  sed -i 's/# %wheel/%wheel/g' /etc/sudoers
                - echo "User configured. Checking configuration"
                - !Sub getent passwd ${CodeEditorUser}
          - name: AddUserApt
            action: aws:runShellScript
            precondition:
              StringEquals:
                - '{{ LinuxFlavor }}'
                - ubuntu
            inputs:
              timeoutSeconds: 300
              runCommand:
                - '#!/bin/bash'
                - set -euo pipefail
                - dpkg --configure -a
                - !Sub |
                  if [[ "${CodeEditorUser}" == "ubuntu" ]]
                  then
                    echo 'Using existing user: ${CodeEditorUser}'
                  elif id "${CodeEditorUser}" &>/dev/null; then
                    echo 'User ${CodeEditorUser} already exists, skipping creation'
                  else
                    echo 'Adding user: ${CodeEditorUser}'
                    adduser --disabled-password --gecos '' ${CodeEditorUser}
                  fi
                  echo "${CodeEditorUser}:{{ CodeEditorPassword }}" | chpasswd
                  usermod -aG sudo ${CodeEditorUser} 2>/dev/null || true
                - !Sub |
                  tee /etc/sudoers.d/91-vscode-user <<EOF
                  ${CodeEditorUser} ALL=(ALL) NOPASSWD:ALL
                  EOF
                - !Sub mkdir -p /home/${CodeEditorUser}/.local/bin && chown -R ${CodeEditorUser}:${CodeEditorUser} /home/${CodeEditorUser}
                - echo "User added. Checking configuration"
                - !Sub getent passwd ${CodeEditorUser}
          - name: UpdateProfile
            action: aws:runShellScript
            inputs:
              timeoutSeconds: 300
              runCommand:
                - '#!/bin/bash'
                - set -euo pipefail
                - echo LANG=en_US.utf-8 >> /etc/environment
                - echo LC_ALL=en_US.UTF-8 >> /etc/environment
                - !Sub echo 'PATH=$PATH:/home/${CodeEditorUser}/.local/bin' >> /home/${CodeEditorUser}/.bashrc
                - !Sub echo 'export PATH' >> /home/${CodeEditorUser}/.bashrc
                - !Sub echo 'export AWS_REGION=${AWS::Region}' >> /home/${CodeEditorUser}/.bashrc
                - !Sub echo 'export AWS_ACCOUNTID=${AWS::AccountId}' >> /home/${CodeEditorUser}/.bashrc
                - !Sub echo 'export NEXT_TELEMETRY_DISABLED=1' >> /home/${CodeEditorUser}/.bashrc
                - !Sub echo "export PS1='\[\033[01;32m\]\u:\[\033[01;34m\]\w\[\033[00m\]\$ '" >> /home/${CodeEditorUser}/.bashrc
                - !Sub chown -R ${CodeEditorUser}:${CodeEditorUser} /home/${CodeEditorUser}
          - name: InstallAWSCLI
            action: aws:runShellScript
            inputs:
              timeoutSeconds: 300
              runCommand:
                - '#!/bin/bash'
                - set -euo pipefail
                - !Sub |
                  if aws --version &>/dev/null; then
                    echo "AWS CLI already installed, updating..."
                    sudo -u ${CodeEditorUser} curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip -o /tmp/aws-cli.zip
                    unzip -q -o -d /tmp /tmp/aws-cli.zip
                    sudo /tmp/aws/install --update
                  else
                    echo "Installing AWS CLI..."
                    sudo -u ${CodeEditorUser} curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip -o /tmp/aws-cli.zip
                    unzip -q -d /tmp /tmp/aws-cli.zip
                    sudo /tmp/aws/install
                  fi
                  rm -rf /tmp/aws /tmp/aws-cli.zip
                  echo "AWS CLI installed. Checking configuration"
                  aws --version
          - name: InstallGitDnf
            action: aws:runShellScript
            precondition:
              StringEquals:
                - '{{ LinuxFlavor }}'
                - al2023
            inputs:
              timeoutSeconds: 300
              runCommand:
                - '#!/bin/bash'
                - set -euo pipefail
                - dnf install -y git
                - !Sub |
                  if [[ "${RepoUrl}" =~ ^codecommit ]];
                  then
                    dnf install -y python3-pip
                    echo "Installing git-remote-codecommit with pip3"
                    sudo -u participant PIP_BREAK_SYSTEM_PACKAGES=1 pip3 install git-remote-codecommit
                  fi
          - name: InstallGitApt
            action: aws:runShellScript
            precondition:
              StringEquals:
                - '{{ LinuxFlavor }}'
                - ubuntu
            inputs:
              timeoutSeconds: 300
              runCommand:
                - '#!/bin/bash'
                - set -euo pipefail
                - dpkg --configure -a
                - add-apt-repository ppa:git-core/ppa
                - apt-get -q update && DEBIAN_FRONTEND=noninteractive apt-get install -y -q git
                - !Sub |
                  if [[ "${RepoUrl}" =~ ^codecommit ]];
                  then
                    apt-get -q update && DEBIAN_FRONTEND=noninteractive apt-get install -y -q python3-pip
                    echo "Installing git-remote-codecommit with pip3"
                    sudo -u participant PIP_BREAK_SYSTEM_PACKAGES=1 pip3 install git-remote-codecommit
                  fi
          - name: ConfigureGit
            action: aws:runShellScript
            inputs:
              timeoutSeconds: 300
              runCommand:
                - '#!/bin/bash'
                - set -euo pipefail
                - !Sub sudo -u ${CodeEditorUser} git config --global user.email "participant@example.com"
                - !Sub sudo -u ${CodeEditorUser} git config --global user.name "Workshop Participant"
                - !Sub sudo -u ${CodeEditorUser} git config --global init.defaultBranch "main"
                - echo "Git installed. Checking configuration"
                - git --version
          - name: CloneRepo
            action: aws:runShellScript
            inputs:
              timeoutSeconds: 600
              runCommand:
                - '#!/bin/bash'
                - set -euo pipefail
                - !Sub |
                  if [[ -z "${RepoUrl}" ]]
                  then
                    echo "No Repo"
                  else
                    mkdir -p ${HomeFolder}
                    chown ${CodeEditorUser}:${CodeEditorUser} ${HomeFolder}
                    RepoUrlRegion=$(echo "${RepoUrl}" | sed "s/{.Region}/${AWS::Region}/g")
                    if [[ -d "${HomeFolder}/.git" ]]; then
                      echo "Git repo already exists, skipping clone"
                    else
                      sudo -u ${CodeEditorUser} git clone $RepoUrlRegion ${HomeFolder} 2>&1
                    fi
                    echo "Repo: '$RepoUrlRegion' cloned. Checking configuration"
                    ls -la ${HomeFolder}
                    sudo -u ${CodeEditorUser} git -C ${HomeFolder} remote -v
                  fi
          - name: DownloadAssets
            action: aws:runShellScript
            inputs:
              timeoutSeconds: 600
              runCommand:
                - '#!/bin/bash'
                - set -euo pipefail
                - !Sub |
                  if [[ -z "${AssetZipS3Path}" ]]
                  then
                    echo "No assets"
                  else
                    mkdir -p ${HomeFolder} && chown -R ${CodeEditorUser}:${CodeEditorUser} ${HomeFolder}
                    aws s3 cp s3://${AssetZipS3Path} /tmp/asset.zip
                    chown -R ${CodeEditorUser}:${CodeEditorUser} /tmp/asset.zip
                    unzip -o /tmp/asset.zip -d ${HomeFolder}
                    chown -R ${CodeEditorUser}:${CodeEditorUser} ${HomeFolder}
                    if  [[ -d ${HomeFolder}/.git ]] # Indicates that a repo has been cloned
                    then
                      sudo -u ${CodeEditorUser} git -C ${HomeFolder} add .
                      sudo -u ${CodeEditorUser} git -C ${HomeFolder} commit -m 'Workshop commit'
                    else
                      sudo -u ${CodeEditorUser} git -C ${HomeFolder} init
                      sudo -u ${CodeEditorUser} git -C ${HomeFolder} add .
                      sudo -u ${CodeEditorUser} git -C ${HomeFolder} commit -m 'Initial commit'
                    fi
                    echo "Assets downloaded. Checking configuration: ${HomeFolder}"
                    ls -la ${HomeFolder}
                    sudo -u ${CodeEditorUser} git -C ${HomeFolder} branch
                  fi
          - name: DownloadFolders
            action: aws:runShellScript
            inputs:
              timeoutSeconds: 600
              runCommand:
                - '#!/bin/bash'
                - set -euo pipefail
                - !Sub |
                  if [[ -z "${FolderZipS3Path}" ]]
                  then
                    echo "No folders"
                  else
                    rm -rf /tmp/folder
                    mkdir -p /tmp/folder && chown -R ${CodeEditorUser}:${CodeEditorUser} /tmp/folder
                    aws s3 cp s3://${FolderZipS3Path} /tmp/asset-folder.zip
                    chown -R ${CodeEditorUser}:${CodeEditorUser} /tmp/asset-folder.zip
                    unzip -o /tmp/asset-folder.zip -d /tmp/folder
                    chown -R ${CodeEditorUser}:${CodeEditorUser} /tmp/folder
                    mkdir -p ${HomeFolder} && chown -R ${CodeEditorUser}:${CodeEditorUser} ${HomeFolder}
                    cd "${HomeFolder}" && cd ..
                    if [[ $(pwd) ==  "/" ]]
                    then
                      targetRootFolder=""
                    else
                      targetRootFolder=$(pwd)
                      chown -R ${CodeEditorUser}:${CodeEditorUser} .
                    fi
                    find "/tmp/folder" -maxdepth 1 -mindepth 1 -type d | while read sourceFolder; do
                      folder="$(basename $sourceFolder)"
                      echo "Processing folder: $folder"
                      targetFolder=$targetRootFolder/$folder
                      if [[ $targetRootFolder == "" ]]
                      then
                        mv $sourceFolder /
                      else
                        mv $sourceFolder $targetRootFolder
                      fi
                      chown -R ${CodeEditorUser}:${CodeEditorUser} $targetFolder
                      sudo -u ${CodeEditorUser} git -C $targetFolder init
                      sudo -u ${CodeEditorUser} git -C $targetFolder add .
                      sudo -u ${CodeEditorUser} git -C $targetFolder commit -m "Initial commit"
                      echo "Folder downloaded. Checking configuration: $targetFolder"
                      ls -la $targetFolder
                    done
                    rm -rf /tmp/folder
                  fi
          - name: DownloadBranches
            action: aws:runShellScript
            inputs:
              timeoutSeconds: 600
              runCommand:
                - '#!/bin/bash'
                - set -euo pipefail
                - !Sub |
                  if [[ -z "${BranchZipS3Path}" ]]
                  then
                    echo "No branches"
                  else
                    rm -rf /tmp/branch
                    rm -rf /tmp/git
                    mkdir -p /tmp/branch && chown -R ${CodeEditorUser}:${CodeEditorUser} /tmp/branch
                    mkdir -p /tmp/git && chown -R ${CodeEditorUser}:${CodeEditorUser} /tmp/git
                    aws s3 cp s3://${BranchZipS3Path} /tmp/asset-branch.zip
                    chown -R ${CodeEditorUser}:${CodeEditorUser} /tmp/asset-branch.zip
                    unzip -o /tmp/asset-branch.zip -d /tmp/branch
                    chown -R ${CodeEditorUser}:${CodeEditorUser} /tmp/branch
                    mkdir -p ${HomeFolder} && chown -R ${CodeEditorUser}:${CodeEditorUser} ${HomeFolder}
                    sudo -u ${CodeEditorUser} git -C ${HomeFolder} init
                    mv ${HomeFolder}/.git /tmp/git
                    rm -rf ${HomeFolder}
                    mkdir -p ${HomeFolder} && chown -R ${CodeEditorUser}:${CodeEditorUser} ${HomeFolder}
                    mv /tmp/git/.git ${HomeFolder}
                    find /tmp/branch -maxdepth 1 -mindepth 1 -type d | while read sourceFolder; do
                      branch="$(basename $sourceFolder)"
                      echo "Processing branch: $branch"
                      sudo -u ${CodeEditorUser} git -C ${HomeFolder} checkout -b $branch 2>&1
                      cp -a $sourceFolder/. ${HomeFolder}
                      sudo -u ${CodeEditorUser} git -C ${HomeFolder} add .
                      sudo -u ${CodeEditorUser} git -C ${HomeFolder} commit -m "Initial commit $branch"
                      mv ${HomeFolder}/.git /tmp/git
                      rm -rf ${HomeFolder}
                      mkdir ${HomeFolder} && chown -R ${CodeEditorUser}:${CodeEditorUser} ${HomeFolder}
                      mv /tmp/git/.git ${HomeFolder}
                    done
                    sudo -u ${CodeEditorUser} git -C ${HomeFolder} checkout main 2>&1
                    sudo -u ${CodeEditorUser} git -C ${HomeFolder} restore .
                    rm -rf /tmp/branch
                    rm -rf /tmp/git
                    echo "Branches downloaded. Checking configuration: $HomeFolder"
                    sudo -u ${CodeEditorUser} git -C ${HomeFolder} branch
                    ls -la ${HomeFolder}
                  fi
          - name: InstallCodeEditor
            action: aws:runShellScript
            inputs:
              timeoutSeconds: 600
              runCommand:
                - '#!/bin/bash'
                - set -euo pipefail
                - !Sub export CodeEditorUser=${CodeEditorUser}
                - curl -fsSL https://code-editor.amazonaws.com/content/code-editor-server/dist/aws-workshop-studio/install.sh | bash -s -- 2>&1 || { echo "Code Editor installation failed"; exit 1; }
          - name: ConfigureNginx
            action: aws:runShellScript
            inputs:
              timeoutSeconds: 600
              runCommand:
                - '#!/bin/bash'
                - set -euo pipefail
                - echo "Configuring nginx..."
                - !Sub |
                  tee /etc/nginx/conf.d/code-editor.conf <<EOF
                  server {
                      listen 80;
                      listen [::]:80;
                      # server_name \$\{CloudFrontDistribution.DomainName\};
                      server_name *.cloudfront.net;
                      proxy_set_header Host \$host;
                      proxy_set_header X-Real-IP \$remote_addr;
                      proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto \$scheme;
                      proxy_set_header Upgrade \$http_upgrade;
                      proxy_set_header Connection "upgrade";
                      proxy_buffering off;
                      proxy_set_header Accept-Encoding gzip;
                      location / {
                          proxy_pass http://localhost:8080/;
                      }
                  }
                  EOF
                - !Sub |
                  if [[ -n "${DevServerBasePath}" ]]
                  then
                      sed -i '$i\
                      location /${DevServerBasePath} {\
                          proxy_pass http://localhost:${DevServerPort};\
                      }\
                      location /ports/${DevServerPort}/ {\
                          return 301 /${DevServerBasePath};\
                      }' /etc/nginx/conf.d/code-editor.conf
                  fi
                - systemctl enable nginx 2>&1
                - systemctl restart nginx
                - echo "Nginx installed. Checking configuration"
                - nginx -t 2>&1
                - systemctl status nginx
          - name: ConfigureAuthToken
            action: aws:runShellScript
            inputs:
              timeoutSeconds: 600
              runCommand:
                - '#!/bin/bash'
                - set -euo pipefail
                - !Sub |
                  sudo -u ${CodeEditorUser} mkdir -p /home/${CodeEditorUser}/.code-editor-server/data
                  # token format: /^[0-9A-Za-z_-]+$/
                  echo -n "{{ CodeEditorPassword }}" | sudo -u ${CodeEditorUser} tee /home/${CodeEditorUser}/.code-editor-server/data/token > /dev/null
                  sudo -u ${CodeEditorUser} chmod 600 /home/${CodeEditorUser}/.code-editor-server/data/token
                  # Restart code-editor service to pick up the new token
                  systemctl restart code-editor@${CodeEditorUser}.service
                  echo "Code editor service restarted with configured token"
          - name: ConfigureCodeEditor
            action: aws:runShellScript
            inputs:
              timeoutSeconds: 600
              runCommand:
                - '#!/bin/bash'
                - set -euo pipefail
                - !Sub sudo -i -u ${CodeEditorUser} mkdir -p /home/${CodeEditorUser}/.code-editor-server/data/User
                - !Sub sudo -i -u ${CodeEditorUser} touch /home/${CodeEditorUser}/.code-editor-server/data/User/settings.json
                - !Sub touch /home/${CodeEditorUser}/.hushlogin
                - !Sub mkdir -p ${HomeFolder} && chown -R ${CodeEditorUser}:${CodeEditorUser} ${HomeFolder}
                - !Sub |
                  tee /home/${CodeEditorUser}/.code-editor-server/data/User/settings.json <<EOF
                  {
                    "aws.telemetry": false,
                    "extensions.autoUpdate": false,
                    "extensions.autoCheckUpdates": false,
                    "telemetry.telemetryLevel": "off",
                    "security.workspace.trust.startupPrompt": "never",
                    "security.workspace.trust.enabled": false,
                    "security.workspace.trust.banner": "never",
                    "security.workspace.trust.emptyWindow": false,
                    "workbench.startupEditor": "none",
                    "terminal.integrated.cwd": "${HomeFolder}",
                    "auto-run-command.rules": [
                      {
                        "command": "workbench.action.terminal.new"
                      }
                    ]
                  }
                  EOF
                - !Sub chown -R ${CodeEditorUser}:${CodeEditorUser} /home/${CodeEditorUser}
                - !Sub systemctl enable --now code-editor@${CodeEditorUser}
                - !Sub systemctl restart code-editor@${CodeEditorUser}
                - echo "Code Editor installed. Checking configuration"
                - !Sub sudo -i -u ${CodeEditorUser} code-editor-server -v
                - !Sub systemctl status code-editor@${CodeEditorUser}
          - name: InstallAWSToolkitExtension
            action: aws:runDocument
            inputs:
              documentType: SSMDocument
              documentPath: !Ref InstallCodeEditorExtensionSSMDoc
              documentParameters:
                ExtensionId: AmazonWebServices.aws-toolkit-vscode
                CodeEditorUser: !Ref CodeEditorUser
          - name: InstallAmazonQExtension
            action: aws:runDocument
            inputs:
              documentType: SSMDocument
              documentPath: !Ref InstallCodeEditorExtensionSSMDoc
              documentParameters:
                ExtensionId: AmazonWebServices.amazon-q-vscode
                CodeEditorUser: !Ref CodeEditorUser
          - name: InstallLiveServerExtension
            action: aws:runDocument
            inputs:
              documentType: SSMDocument
              documentPath: !Ref InstallCodeEditorExtensionSSMDoc
              documentParameters:
                ExtensionId: ms-vscode.live-server
                CodeEditorUser: !Ref CodeEditorUser
          - name: InstallAutoRunCommandExtension
            action: aws:runDocument
            inputs:
              documentType: SSMDocument
              documentPath: !Ref InstallCodeEditorExtensionSSMDoc
              documentParameters:
                ExtensionId: synedra.auto-run-command
                CodeEditorUser: !Ref CodeEditorUser
          - name: InstallJupyterExtension
            action: aws:runDocument
            inputs:
              documentType: SSMDocument
              documentPath: !Ref InstallCodeEditorExtensionSSMDoc
              documentParameters:
                ExtensionId: ms-toolsai.jupyter
                CodeEditorUser: !Ref CodeEditorUser
          - name: InstallPython313
            action: aws:runShellScript
            precondition:
              StringEquals:
                - '{{ LinuxFlavor }}'
                - al2023
            inputs:
              timeoutSeconds: 300
              runCommand:
                - '#!/bin/bash'
                - dnf install -y python3.13 python3.13-pip python3-virtualenv 2>&1
                - !Sub echo 'alias python3=python3.13' >> /home/${CodeEditorUser}/.bashrc
                - !Sub echo 'alias pip3=pip3.13' >> /home/${CodeEditorUser}/.bashrc
                - python3.13 -m pip install --upgrade pip 2>&1
                - echo "Python 3.13 installed OK"
                - python3.13 --version
          - name: InstallWorkshopPackages
            action: aws:runShellScript
            inputs:
              timeoutSeconds: 600
              runCommand:
                - '#!/bin/bash'
                - !Sub |
                    # Install packages system-wide (as root)
                    python3.13 -m pip install -q "strands-agents>=1.27.0" "boto3>=1.35.0" "python-dotenv>=1.0.1" 2>&1
                    python3.13 -m pip install -q "neo4j>=5.28.0" "neo4j-graphrag>=1.13.0" "faiss-cpu>=1.9.0" 2>&1
                    python3.13 -m pip install -q "bedrock-agentcore-starter-toolkit" 2>&1
                    python3.13 -m pip install -q "agent-control-sdk[strands-agents]" 2>&1 || true
                    python3.13 -m pip install -q ipykernel jupyter 2>&1

                    # Install kernel as participant user so Jupyter can see it
                    sudo -u ${CodeEditorUser} python3.13 -m ipykernel install --user --name workshop --display-name "Workshop (Python 3.13)"
                    echo "Kernel installed for user ${CodeEditorUser}"

                # Configure Jupyter kernel to inherit environment variables
                - !Sub |
                    # Kernel is installed in user's home: ~/.local/share/jupyter/kernels/workshop
                    KERNEL_DIR="/home/${CodeEditorUser}/.local/share/jupyter/kernels/workshop"
                    if [ -d "$KERNEL_DIR" ]; then
                      NEO4J_PASS=$(aws secretsmanager get-secret-value --secret-id ${Neo4jPasswordSecret} --region ${AWS::Region} --query 'SecretString' --output text | jq -r '.password')
                      cat > /tmp/update_kernel.py << 'EOFPYTHON'
                    import json, os, sys
                    kernel_dir = sys.argv[1]
                    neo4j_pass = sys.argv[2]
                    neo4j_uri = sys.argv[3]
                    neo4j_host = sys.argv[4]
                    neo4j_secret = sys.argv[5]
                    aws_region = sys.argv[6]
                    kernel_path = f"{kernel_dir}/kernel.json"
                    with open(kernel_path, 'r') as f:
                      spec = json.load(f)
                    spec['env'] = {
                      'AWS_REGION': aws_region,
                      'AWS_DEFAULT_REGION': aws_region,
                      'NEO4J_URI': neo4j_uri,
                      'NEO4J_USER': 'neo4j',
                      'NEO4J_PASSWORD': neo4j_pass,
                      'NEO4J_HOST': neo4j_host,
                      'NEO4J_SECRET_ARN': neo4j_secret
                    }
                    with open(kernel_path, 'w') as f:
                      json.dump(spec, f, indent=2)
                    EOFPYTHON
                      python3.13 /tmp/update_kernel.py "$KERNEL_DIR" "$NEO4J_PASS" "bolt://${Neo4jNetworkLoadBalancer.DNSName}:7687" "${Neo4jNetworkLoadBalancer.DNSName}" "${Neo4jPasswordSecret}" "${AWS::Region}"
                      chown -R ${CodeEditorUser}:${CodeEditorUser} "$KERNEL_DIR"
                      echo "Kernel configuration updated at $KERNEL_DIR"
                    else
                      echo "WARNING: Kernel directory not found at $KERNEL_DIR"
                    fi

                - !Sub mkdir -p ${HomeFolder}/.vscode
                - !Sub python3.13 -c "import json; json.dump({'python.defaultInterpreterPath':'/usr/bin/python3.13','jupyter.preferredKernelName':'workshop'}, open('${HomeFolder}/.vscode/settings.json','w'), indent=2)"
                - !Sub chown -R ${CodeEditorUser}:${CodeEditorUser} ${HomeFolder}/.vscode
                - ln -sf /usr/bin/python3.13 /usr/local/bin/python3
                - ln -sf /usr/bin/python3.13 /usr/local/bin/python
                - echo "Workshop packages installed OK"
          - name: CreateEnvFile
            action: aws:runShellScript
            inputs:
              timeoutSeconds: 120
              runCommand:
                - '#!/bin/bash'
                - !Sub |
                    # Wait for Neo4j to be ready (NLB DNS should resolve)
                    echo "Waiting for Neo4j NLB DNS to be available..."
                    for i in {1..30}; do
                      if nslookup ${Neo4jNetworkLoadBalancer.DNSName} >/dev/null 2>&1; then
                        echo "Neo4j NLB DNS resolved"
                        break
                      fi
                      echo "Waiting... ($i/30)"
                      sleep 10
                    done

                    # Retrieve Neo4j password from Secrets Manager
                    NEO4J_PASS=$(aws secretsmanager get-secret-value --secret-id ${Neo4jPasswordSecret} --region ${AWS::Region} --query 'SecretString' --output text | jq -r '.password')

                    # Get Neo4j task private IP for VPC Lambda connectivity
                    # Use NLB DNS for Neo4j connectivity (stable across task restarts)
                    echo "✅ Neo4j NLB endpoint: ${Neo4jNetworkLoadBalancer.DNSName}"

                    # Write environment variables to /etc/environment for Module 06 notebook
                    echo "NEO4J_HOST=${Neo4jNetworkLoadBalancer.DNSName}" >> /etc/environment
                    echo "NEO4J_SECRET_ARN=${Neo4jPasswordSecret}" >> /etc/environment
                    echo "SECURITY_GROUP_ID=${Neo4jSecurityGroup}" >> /etc/environment
                    echo "SUBNET_IDS=${PublicSubnet1},${PublicSubnet2}" >> /etc/environment

                    # Create /workshop/.env with all Neo4j environment variables
                    cat > ${HomeFolder}/.env << 'ENVEOF'
                    AWS_REGION=${AWS::Region}
                    AWS_DEFAULT_REGION=${AWS::Region}
                    NEO4J_URI=bolt://${Neo4jNetworkLoadBalancer.DNSName}:7687
                    NEO4J_HOST=${Neo4jNetworkLoadBalancer.DNSName}
                    NEO4J_USER=neo4j
                    NEO4J_PASSWORD=PLACEHOLDER_PASSWORD
                    NEO4J_SECRET_ARN=${Neo4jPasswordSecret}
                    SECURITY_GROUP_ID=${Neo4jSecurityGroup}
                    SUBNET_IDS=${PublicSubnet1},${PublicSubnet2}
                    ENVEOF

                    # Replace placeholders with actual values
                    sed -i "s|PLACEHOLDER_PASSWORD|$NEO4J_PASS|g" ${HomeFolder}/.env

                    # Set ownership and permissions
                    chown ${CodeEditorUser}:${CodeEditorUser} ${HomeFolder}/.env
                    chmod 600 ${HomeFolder}/.env

                    echo "✅ Created ${HomeFolder}/.env with Neo4j credentials"
                    echo "   NEO4J_HOST=${Neo4jNetworkLoadBalancer.DNSName} (NLB endpoint)"
                    echo "   NEO4J_URI=bolt://${Neo4jNetworkLoadBalancer.DNSName}:7687"
                    echo "   NEO4J_PASSWORD=****** (from Secrets Manager)"
# Install optional packages here
