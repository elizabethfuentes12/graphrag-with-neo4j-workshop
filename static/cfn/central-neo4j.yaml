AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Central Neo4j for Workshop Studio — single consolidated template (no nested stacks).
  Deploys: VPC discovery, Secret, S3, IAM, ECS cluster, build task (fire-and-forget),
  Neo4j service with NLB, and lifecycle Lambda that pushes connection details to
  each participant account SSM automatically on deployment_success.

Parameters:
  NotificationBusArn:
    Type: String
    Default: ""
    Description: "{{.NotificationBusArn}}"
  WSEventsAPIEndpoint:
    Type: String
    Default: ""
    Description: "{{.WSEventsAPIEndpoint}}"
  WSEventsAPIRegion:
    Type: String
    Default: ""
    Description: "{{.WSEventsAPIRegion}}"
  RepoUrl:
    Type: String
    Default: "https://github.com/neo4j-partners/sample-stop-ai-agent-hallucinations-workshop"
  HotelFaqsUrl:
    Type: String
    Default: ""
  BedrockRegion:
    Type: String
    Default: "us-east-1"
  Neo4jCpu:
    Type: String
    Default: "2048"
  Neo4jMemory:
    Type: String
    Default: "4096"
  AssetsBucketName:
    Type: String
    Default: ""
    Description: "{{.AssetsBucketName}}"
  AssetsBucketPrefix:
    Type: String
    Default: ""
    Description: "{{.AssetsBucketPrefix}}"

Conditions:
  HasNotificationBus: !Not [!Equals [!Ref NotificationBusArn, ""]]

Resources:

  # ── VPC Discovery ─────────────────────────────────────────────────────────────
  VpcDiscoveryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DescribeVPC
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ec2:DescribeVpcs, ec2:DescribeSubnets]
                Resource: "*"

  VpcDiscoveryLambda:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: VPC discovery Lambda does not need VPC access
          - id: W92
            reason: One-time discovery Lambda
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt VpcDiscoveryRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import boto3, json, urllib3

          def send(url, status, pid, sid, rid, lid, data={}):
              body = json.dumps({'Status': status, 'PhysicalResourceId': pid,
                  'StackId': sid, 'RequestId': rid, 'LogicalResourceId': lid, 'Data': data})
              urllib3.PoolManager().request('PUT', url, body=body, headers={'Content-Type': ''})

          def handler(event, context):
              pid = event.get('PhysicalResourceId', 'vpc-discovery')
              if event['RequestType'] == 'Delete':
                  send(event['ResponseURL'], 'SUCCESS', pid,
                       event['StackId'], event['RequestId'], event['LogicalResourceId'])
                  return
              try:
                  ec2 = boto3.client('ec2')
                  # First try to find VPC tagged by Code Editor CloudFormation
                  vpcs = ec2.describe_vpcs(Filters=[
                      {'Name': 'tag:aws:cloudformation:logical-id', 'Values': ['VPC']},
                      {'Name': 'tag-key', 'Values': ['aws:cloudformation:stack-name']},
                  ])['Vpcs']
                  # Sort by creation time (newest first) to get Code Editor VPC
                  vpcs = sorted(vpcs, key=lambda v: v.get('Tags', [{}])[0].get('Value', ''), reverse=True)
                  if not vpcs:
                      # Fallback: use default VPC
                      vpcs = ec2.describe_vpcs(Filters=[{'Name': 'isDefault', 'Values': ['true']}])['Vpcs']
                  if not vpcs:
                      raise Exception('No VPC found (looked for CFN-tagged VPC, then default)')
                  vpc_id = vpcs[0]['VpcId']
                  subnets = ec2.describe_subnets(Filters=[
                      {'Name': 'vpc-id', 'Values': [vpc_id]},
                      {'Name': 'defaultForAz', 'Values': ['true']},
                  ])['Subnets']
                  if len(subnets) < 2:
                      raise Exception(f'Need 2+ subnets, found {len(subnets)}')
                  seen_az, picked = set(), []
                  for s in subnets:
                      if s['AvailabilityZone'] not in seen_az:
                          picked.append(s['SubnetId'])
                          seen_az.add(s['AvailabilityZone'])
                      if len(picked) == 2:
                          break
                  send(event['ResponseURL'], 'SUCCESS', pid,
                       event['StackId'], event['RequestId'], event['LogicalResourceId'],
                       {'VpcId': vpc_id, 'SubnetId1': picked[0], 'SubnetId2': picked[1]})
              except Exception as e:
                  send(event['ResponseURL'], 'FAILED', pid,
                       event['StackId'], event['RequestId'], event['LogicalResourceId'],
                       {'Error': str(e)})

  VpcDiscovery:
    Type: Custom::VpcDiscovery
    Properties:
      ServiceToken: !GetAtt VpcDiscoveryLambda.Arn

  # ── Secret & S3 ───────────────────────────────────────────────────────────────
  Neo4jSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      GenerateSecretString:
        PasswordLength: 20
        ExcludePunctuation: true

  GraphDumpBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: cleanup-old-dumps
            Status: Enabled
            ExpirationInDays: 30

  BucketEmptierRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EmptyBucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket, s3:ListBucketVersions, s3:DeleteObject, s3:DeleteObjectVersion]
                Resource:
                  - !GetAtt GraphDumpBucket.Arn
                  - !Sub "${GraphDumpBucket.Arn}/*"

  BucketEmptierLambda:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Bucket emptier Lambda does not need VPC
          - id: W92
            reason: One-time cleanup Lambda
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt BucketEmptierRole.Arn
      Timeout: 300
      Code:
        ZipFile: |
          import boto3, json, urllib3

          def send(event, status, data={}):
              body = json.dumps({'Status': status,
                  'PhysicalResourceId': event.get('PhysicalResourceId', event['LogicalResourceId']),
                  'StackId': event['StackId'], 'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'], 'Data': data})
              urllib3.PoolManager().request('PUT', event['ResponseURL'],
                  body=body, headers={'Content-Type': ''})

          def handler(event, context):
              bucket = event['ResourceProperties']['BucketName']
              if event['RequestType'] == 'Delete':
                  try:
                      s3 = boto3.client('s3')
                      for page in s3.get_paginator('list_objects_v2').paginate(Bucket=bucket):
                          objects = [{'Key': o['Key']} for o in page.get('Contents', [])]
                          if objects:
                              s3.delete_objects(Bucket=bucket, Delete={'Objects': objects})
                  except Exception as e:
                      send(event, 'FAILED', {'Error': str(e)})
                      return
              send(event, 'SUCCESS')

  EmptyBucketOnDelete:
    Type: Custom::EmptyBucketOnDelete
    DependsOn: GraphDumpBucket
    Properties:
      ServiceToken: !GetAtt BucketEmptierLambda.Arn
      BucketName: !Ref GraphDumpBucket

  # ── Security Group & IAM ──────────────────────────────────────────────────────
  Neo4jSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: Neo4j Bolt must be reachable from all participant accounts via NLB
          - id: W40
            reason: All outbound required for S3 and Bedrock access from Fargate tasks
    Properties:
      GroupDescription: Central Neo4j - Bolt from internet, all outbound for S3/Bedrock
      VpcId: !GetAtt VpcDiscovery.VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 7687
          ToPort: 7687
          CidrIp: 0.0.0.0/0
          Description: Neo4j Bolt

  Neo4jExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref Neo4jSecret

  Neo4jTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3AndBedrock
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:HeadObject, s3:ListBucket]
                Resource:
                  - !GetAtt GraphDumpBucket.Arn
                  - !Sub "${GraphDumpBucket.Arn}/*"
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:HeadObject, s3:ListBucket]
                Resource:
                  - !Sub "arn:aws:s3:::${AssetsBucketName}"
                  - !Sub "arn:aws:s3:::${AssetsBucketName}/*"
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - !Sub "arn:aws:bedrock:*::foundation-model/anthropic.*"
                  - !Sub "arn:aws:bedrock:*::foundation-model/amazon.*"
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.anthropic.*"
              - Effect: Allow
                Action: [aws-marketplace:ViewSubscriptions, aws-marketplace:Subscribe]
                Resource: "*"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref Neo4jSecret

  # ── Log Groups & ECS Cluster ──────────────────────────────────────────────────
  Neo4jLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}/neo4j"
      RetentionInDays: 7

  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}/build"
      RetentionInDays: 7

  Neo4jCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}-neo4j"

  # ── Build Task (fire-and-forget) ───────────────────────────────────────────────
  BuildTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-build"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: "256"
      Memory: "512"
      EphemeralStorage:
        SizeInGiB: 21
      ExecutionRoleArn: !GetAtt Neo4jExecutionRole.Arn
      TaskRoleArn: !GetAtt Neo4jTaskRole.Arn
      ContainerDefinitions:
        - Name: graph-builder
          Image: public.ecr.aws/docker/library/python:3.12-slim
          Essential: true
          Environment:
            - Name: DUMP_BUCKET
              Value: !Ref GraphDumpBucket
            - Name: ASSETS_BUCKET
              Value: !Ref AssetsBucketName
            - Name: ASSETS_PREFIX
              Value: !Ref AssetsBucketPrefix
            - Name: REPO_URL
              Value: !Ref RepoUrl
            - Name: HOTEL_FAQS_URL
              Value: !Ref HotelFaqsUrl
            - Name: AWS_REGION
              Value: !Ref BedrockRegion
          EntryPoint: ["/bin/bash", "-c"]
          Command:
            - |
              set -e
              echo "=== Downloading pre-built Neo4j database ==="

              apt-get update -qq && apt-get install -y -qq python3-venv curl 2>/dev/null
              python3 -m venv /opt/venv
              /opt/venv/bin/pip install -q --upgrade pip
              /opt/venv/bin/pip install -q "boto3>=1.35.0"

              S3_GET() { /opt/venv/bin/python3 -c "import boto3; boto3.client('s3').download_file('$1','$2','$3')"; }
              S3_PUT() { /opt/venv/bin/python3 -c "import boto3; boto3.client('s3').upload_file('$1','$2','$3')"; }
              S3_EXISTS() { /opt/venv/bin/python3 -c "import boto3,sys; boto3.client('s3').head_object(Bucket='$1',Key='$2')" 2>/dev/null; }

              # Try tar.gz format first (Community compatible raw database)
              ASSETS_TAR_KEY="${ASSETS_PREFIX}neo4j-hotel-graph.tar.gz"
              if [[ -n "$ASSETS_BUCKET" ]] && S3_EXISTS "$ASSETS_BUCKET" "$ASSETS_TAR_KEY"; then
                echo "✓ Found pre-built database (tar.gz format)"
                S3_GET "$ASSETS_BUCKET" "$ASSETS_TAR_KEY" /tmp/neo4j-hotel-graph.tar.gz
                S3_PUT /tmp/neo4j-hotel-graph.tar.gz "$DUMP_BUCKET" "neo4j-hotel-graph.tar.gz"
                echo "=== Database ready ==="
                exit 0
              fi

              # Fallback to .dump format
              ASSETS_DUMP_KEY="${ASSETS_PREFIX}neo4j-hotel-graph.dump"
              if [[ -n "$ASSETS_BUCKET" ]] && S3_EXISTS "$ASSETS_BUCKET" "$ASSETS_DUMP_KEY"; then
                echo "✓ Found pre-built database (.dump format)"
                S3_GET "$ASSETS_BUCKET" "$ASSETS_DUMP_KEY" /tmp/neo4j-graph.dump
                S3_PUT /tmp/neo4j-graph.dump "$DUMP_BUCKET" "neo4j-graph.dump"
                echo "=== Database ready ==="
                exit 0
              fi

              echo "ERROR: No pre-built database found in assets bucket"
              echo "Expected: s3://$ASSETS_BUCKET/$ASSETS_TAR_KEY"
              echo "      or: s3://$ASSETS_BUCKET/$ASSETS_DUMP_KEY"
              exit 1
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BuildLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: build

  BuildTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: RunECSTask
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ecs:RunTask, ecs:StopTask, ecs:ListTasks, ecs:CreateService, iam:PassRole]
                Resource: "*"
              - Effect: Allow
                Action: [ssm:PutParameter, ssm:DeleteParameter, ssm:GetParameter]
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/workshop/${AWS::StackName}/*"

  BuildTriggerLambda:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Build trigger Lambda does not need VPC
          - id: W92
            reason: One-time trigger Lambda
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt BuildTriggerRole.Arn
      Timeout: 60
      Environment:
        Variables:
          CLUSTER: !Ref Neo4jCluster
          TASK_DEF: !Ref BuildTaskDefinition
          SUBNET: !GetAtt VpcDiscovery.SubnetId1
          SG: !Ref Neo4jSecurityGroup
          TASK_ARN_PARAM: !Sub "/workshop/${AWS::StackName}/build-task-arn"
          # Service params stored in SSM so ServiceLauncherLambda can create the ECS service
          SERVICE_CLUSTER: !Ref Neo4jCluster
          SERVICE_TASK_DEF: !Ref Neo4jTaskDefinition
          SERVICE_SUBNET: !GetAtt VpcDiscovery.SubnetId1
          SERVICE_SG: !Ref Neo4jSecurityGroup
          SERVICE_TG_ARN: !Ref Neo4jTargetGroup
          SERVICE_NAME: !Sub "${AWS::StackName}-neo4j"
          NEO4J_CPU: !Ref Neo4jCpu
          NEO4J_MEMORY: !Ref Neo4jMemory
      Code:
        ZipFile: |
          import boto3, os, json, urllib3

          def send(url, status, pid, sid, rid, lid, data={}):
              body = json.dumps({'Status': status, 'PhysicalResourceId': pid,
                  'StackId': sid, 'RequestId': rid, 'LogicalResourceId': lid, 'Data': data})
              urllib3.PoolManager().request('PUT', url, body=body, headers={'Content-Type': ''})

          def handler(event, context):
              pid = event.get('PhysicalResourceId', event['LogicalResourceId'])
              ssm = boto3.client('ssm')
              if event['RequestType'] == 'Delete':
                  for param in ['build-task-arn', 'service-params']:
                      try:
                          ssm.delete_parameter(Name=f"/workshop/{os.environ['SERVICE_NAME'].rsplit('-', 1)[0]}/{param}")
                      except Exception:
                          pass
                  # Stop ECS service on delete
                  try:
                      boto3.client('ecs').update_service(
                          cluster=os.environ['SERVICE_CLUSTER'],
                          service=os.environ['SERVICE_NAME'],
                          desiredCount=0)
                      boto3.client('ecs').delete_service(
                          cluster=os.environ['SERVICE_CLUSTER'],
                          service=os.environ['SERVICE_NAME'],
                          force=True)
                  except Exception:
                      pass
                  send(event['ResponseURL'], 'SUCCESS', pid,
                       event['StackId'], event['RequestId'], event['LogicalResourceId'])
                  return
              try:
                  ecs = boto3.client('ecs')
                  resp = ecs.run_task(
                      cluster=os.environ['CLUSTER'],
                      taskDefinition=os.environ['TASK_DEF'],
                      launchType='FARGATE',
                      networkConfiguration={'awsvpcConfiguration': {
                          'subnets': [os.environ['SUBNET']],
                          'securityGroups': [os.environ['SG']],
                          'assignPublicIp': 'ENABLED',
                      }},
                  )
                  task_arn = resp['tasks'][0]['taskArn']
                  # Store build task ARN and service params for ServiceLauncherLambda
                  ssm.put_parameter(Name=os.environ['TASK_ARN_PARAM'],
                      Value=task_arn, Type='String', Overwrite=True)
                  ssm.put_parameter(
                      Name=f"{os.environ['TASK_ARN_PARAM'].rsplit('/', 1)[0]}/service-params",
                      Value=json.dumps({
                          'cluster': os.environ['SERVICE_CLUSTER'],
                          'taskDef': os.environ['SERVICE_TASK_DEF'],
                          'subnet': os.environ['SERVICE_SUBNET'],
                          'sg': os.environ['SERVICE_SG'],
                          'tgArn': os.environ['SERVICE_TG_ARN'],
                          'serviceName': os.environ['SERVICE_NAME'],
                      }),
                      Type='String', Overwrite=True)
                  print(f"Build task started: {task_arn}")
                  send(event['ResponseURL'], 'SUCCESS', task_arn,
                       event['StackId'], event['RequestId'], event['LogicalResourceId'],
                       {'TaskArn': task_arn})
              except Exception as e:
                  send(event['ResponseURL'], 'FAILED', pid,
                       event['StackId'], event['RequestId'], event['LogicalResourceId'],
                       {'Error': str(e)})

  # ServiceLauncherLambda: fires when the build ECS task stops with exit 0.
  # Creates the Neo4jService (ECS service) outside of CloudFormation so CFN
  # never waits for it to stabilize (which would timeout during the 60-min build).
  ServiceLauncherLambda:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Service launcher Lambda does not need VPC
          - id: W92
            reason: Event-driven Lambda
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt BuildTriggerRole.Arn
      Timeout: 60
      Environment:
        Variables:
          CLUSTER_ARN: !GetAtt Neo4jCluster.Arn
          TASK_ARN_PARAM: !Sub "/workshop/${AWS::StackName}/build-task-arn"
          SERVICE_PARAMS_PARAM: !Sub "/workshop/${AWS::StackName}/service-params"
      Code:
        ZipFile: |
          import boto3, os, json

          def handler(event, context):
              detail = event.get('detail', {})
              cluster_arn = detail.get('clusterArn', '')
              if os.environ['CLUSTER_ARN'] != cluster_arn:
                  print(f"Ignoring task from different cluster: {cluster_arn}")
                  return
              # Verify this is our build task
              ssm = boto3.client('ssm')
              try:
                  stored_arn = ssm.get_parameter(Name=os.environ['TASK_ARN_PARAM'])['Parameter']['Value']
                  if stored_arn != detail.get('taskArn', ''):
                      print("Task ARN mismatch — ignoring")
                      return
              except Exception:
                  print("No stored build task ARN — ignoring")
                  return
              containers = detail.get('containers', [])
              exit_code = containers[0].get('exitCode') if containers else None
              print(f"Build task stopped. Exit: {exit_code}. Reason: {detail.get('stoppedReason', '')}")
              if exit_code != 0:
                  print(f"Build failed (exit {exit_code}) — Neo4j service NOT created")
                  return
              # Load service params
              params = json.loads(ssm.get_parameter(Name=os.environ['SERVICE_PARAMS_PARAM'])['Parameter']['Value'])
              ecs = boto3.client('ecs')
              try:
                  ecs.create_service(
                      cluster=params['cluster'],
                      serviceName=params['serviceName'],
                      taskDefinition=params['taskDef'],
                      launchType='FARGATE',
                      desiredCount=1,
                      networkConfiguration={'awsvpcConfiguration': {
                          'subnets': [params['subnet']],
                          'securityGroups': [params['sg']],
                          'assignPublicIp': 'ENABLED',
                      }},
                      loadBalancers=[{
                          'targetGroupArn': params['tgArn'],
                          'containerName': 'neo4j',
                          'containerPort': 7687,
                      }],
                      deploymentConfiguration={
                          'deploymentCircuitBreaker': {'enable': False, 'rollback': False},
                          'minimumHealthyPercent': 0,
                          'maximumPercent': 100,
                      },
                      healthCheckGracePeriodSeconds=300,
                  )
                  print(f"Neo4j ECS service created: {params['serviceName']}")
              except ecs.exceptions.InvalidParameterException as e:
                  if 'already exists' in str(e):
                      print(f"Service already exists — skipping")
                  else:
                      raise

  BuildTaskStoppedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "neo4j-build-stopped-${AWS::AccountId}"
      EventPattern:
        source: [aws.ecs]
        detail-type: ["ECS Task State Change"]
        detail:
          clusterArn:
            - !GetAtt Neo4jCluster.Arn
          lastStatus: [STOPPED]
          group:
            - !Sub "family:${AWS::StackName}-build"
      Targets:
        - Id: ServiceLauncherTarget
          Arn: !GetAtt ServiceLauncherLambda.Arn

  ServiceLauncherPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ServiceLauncherLambda.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt BuildTaskStoppedRule.Arn

  BuildTrigger:
    Type: Custom::BuildTrigger
    DependsOn:
      - BuildTaskDefinition
      - Neo4jNLB
      - Neo4jListener
      - ServiceLauncherPermission
    Properties:
      ServiceToken: !GetAtt BuildTriggerLambda.Arn
      TriggerVersion: "1"

  # ── Neo4j Service Task + NLB ──────────────────────────────────────────────────
  # NOTE: Neo4jService (AWS::ECS::Service) is created by ServiceLauncherLambda
  # when the build ECS task completes (exit 0). It is NOT in CloudFormation. This avoids CFN timeout waiting for ECS service to stabilize.
  Neo4jTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-neo4j"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: !Ref Neo4jCpu
      Memory: !Ref Neo4jMemory
      EphemeralStorage:
        SizeInGiB: 21
      ExecutionRoleArn: !GetAtt Neo4jExecutionRole.Arn
      TaskRoleArn: !GetAtt Neo4jTaskRole.Arn
      Volumes:
        - Name: dump-volume
      ContainerDefinitions:
        - Name: dump-downloader
          Image: amazon/aws-cli:latest
          Essential: false
          EntryPoint: ["/bin/sh", "-c"]
          Environment:
            - Name: DUMP_BUCKET
              Value: !Ref GraphDumpBucket
          MountPoints:
            - SourceVolume: dump-volume
              ContainerPath: /dump
          Command:
            - |
              echo "Waiting for database in S3..."
              for i in $(seq 1 60); do
                # Try tar.gz format first (raw database files - Community compatible)
                if aws s3 cp "s3://$DUMP_BUCKET/neo4j-hotel-graph.tar.gz" /dump/neo4j-hotel-graph.tar.gz 2>/dev/null; then
                  echo "Raw database found, ready."
                  exit 0
                fi
                # Fallback to .dump format
                if aws s3 cp "s3://$DUMP_BUCKET/neo4j-graph.dump" /dump/neo4j-graph.dump 2>/dev/null; then
                  echo "Dump found, ready."
                  exit 0
                fi
                echo "Attempt $i/60 — waiting 30s..."
                sleep 30
              done
              echo "ERROR: database not found after 30 min" && exit 1
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Neo4jLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: downloader

        - Name: neo4j
          Image: neo4j:2026.03.1-community
          Essential: true
          DependsOn:
            - ContainerName: dump-downloader
              Condition: SUCCESS
          PortMappings:
            - ContainerPort: 7687
              Protocol: tcp
          MountPoints:
            - SourceVolume: dump-volume
              ContainerPath: /dump
          Secrets:
            - Name: NEO4J_PASSWORD
              ValueFrom: !Ref Neo4jSecret
          EntryPoint: ["/bin/bash", "-c"]
          Command:
            - |
              set -e

              # Load database BEFORE any Neo4j initialization
              if [ -f /dump/neo4j-hotel-graph.tar.gz ]; then
                echo "Loading from raw database files..."
                mkdir -p /var/lib/neo4j/data/databases
                tar -xzf /dump/neo4j-hotel-graph.tar.gz -C /var/lib/neo4j/data/databases/
                echo "✓ Database files extracted to /var/lib/neo4j/data/databases/neo4j"
                ls -la /var/lib/neo4j/data/databases/neo4j/ | head -10
              elif [ -f /dump/neo4j-graph.dump ]; then
                echo "Loading from dump file..."
                neo4j-admin database load neo4j \
                  --from-stdin --overwrite-destination=true \
                  < /dump/neo4j-graph.dump
              else
                echo "ERROR: No database file found in /dump"
                exit 1
              fi

              # Configure Neo4j
              sed -i 's/^#*\s*server\.default_listen_address=.*/server.default_listen_address=0.0.0.0/' \
                /var/lib/neo4j/conf/neo4j.conf
              grep -q "^server.default_listen_address" /var/lib/neo4j/conf/neo4j.conf || \
                echo "server.default_listen_address=0.0.0.0" >> /var/lib/neo4j/conf/neo4j.conf

              # Set ownership and permissions
              chown -R neo4j:neo4j /var/lib/neo4j

              # Set password and start
              neo4j-admin dbms set-initial-password "$NEO4J_PASSWORD" 2>&1 || true
              export NEO4J_AUTH="neo4j/$NEO4J_PASSWORD"
              exec neo4j console
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Neo4jLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: neo4j

  Neo4jNLB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "neo4j-${AWS::AccountId}"
      Scheme: internet-facing
      Type: network
      Subnets:
        - !GetAtt VpcDiscovery.SubnetId1
        - !GetAtt VpcDiscovery.SubnetId2

  Neo4jTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "neo4j-tg-${AWS::AccountId}"
      Protocol: TCP
      Port: 7687
      VpcId: !GetAtt VpcDiscovery.VpcId
      TargetType: ip
      HealthCheckProtocol: TCP
      HealthCheckPort: "7687"
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  Neo4jListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Neo4jNLB
      Protocol: TCP
      Port: 7687
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref Neo4jTargetGroup

  # ── Lifecycle Lambda ───────────────────────────────────────────────────────────
  # Fires on deployment_success. Assumes WSOps role in participant account and
  # writes NEO4J_URI / NEO4J_USER / NEO4J_PASSWORD to SSM. No ARNs exposed.

  LifecycleLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: PushToParticipant
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: "arn:aws:iam::*:role/WSParticipantRole"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref Neo4jSecret

  LifecycleLambda:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Lifecycle Lambda does not need VPC
          - id: W92
            reason: Event-driven Lambda
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LifecycleLambdaRole.Arn
      Timeout: 30
      Environment:
        Variables:
          NEO4J_ENDPOINT: !Sub "bolt://${Neo4jNLB.DNSName}:7687"
          NEO4J_SECRET_ARN: !Ref Neo4jSecret
          NEO4J_USER: neo4j
          SSM_URI_PARAM: /workshop/neo4j/uri
          SSM_USER_PARAM: /workshop/neo4j/user
          SSM_PASSWORD_PARAM: /workshop/neo4j/password
          SSM_SECRET_ARN_PARAM: /workshop/neo4j/secret-arn
      Code:
        ZipFile: |
          import boto3, os, json

          def handler(event, context):
              print(f"LIFECYCLE EVENT: {json.dumps(event)}")
              detail = event.get('detail', {})
              status = detail.get('status') or detail.get('Status', '')
              if 'deployment_success' not in str(status):
                  print(f"Ignoring status: {status}")
                  return
              team_role_arn = (detail.get('teamRoleArn') or detail.get('opsRoleArn') or
                  detail.get('wsOpsRoleArn') or detail.get('team_role_arn') or
                  detail.get('ops_role_arn'))
              if not team_role_arn:
                  print(f"No role ARN found. detail: {json.dumps(detail)}")
                  return
              password = boto3.client('secretsmanager').get_secret_value(
                  SecretId=os.environ['NEO4J_SECRET_ARN'])['SecretString']
              creds = boto3.client('sts').assume_role(
                  RoleArn=team_role_arn,
                  RoleSessionName='neo4j-lifecycle-push')['Credentials']
              ssm = boto3.client('ssm',
                  aws_access_key_id=creds['AccessKeyId'],
                  aws_secret_access_key=creds['SecretAccessKey'],
                  aws_session_token=creds['SessionToken'])
              for name, value, ptype in [
                  (os.environ['SSM_URI_PARAM'],        os.environ['NEO4J_ENDPOINT'],   'String'),
                  (os.environ['SSM_USER_PARAM'],       os.environ['NEO4J_USER'],       'String'),
                  (os.environ['SSM_PASSWORD_PARAM'],   password,                       'SecureString'),
                  (os.environ['SSM_SECRET_ARN_PARAM'], os.environ['NEO4J_SECRET_ARN'], 'String'),
              ]:
                  ssm.put_parameter(Name=name, Value=value, Type=ptype, Overwrite=True, Tier='Standard')
              print("Done — Neo4j config pushed to participant SSM")

  LifecycleEventRule:
    Type: AWS::Events::Rule
    Condition: HasNotificationBus
    Properties:
      Name: !Sub "neo4j-lifecycle-${AWS::AccountId}"
      EventBusName: !Ref NotificationBusArn
      EventPattern:
        detail:
          status: [deployment_success]
      Targets:
        - Id: LifecycleLambdaTarget
          Arn: !GetAtt LifecycleLambda.Arn

  LifecycleEventPermission:
    Type: AWS::Lambda::Permission
    Condition: HasNotificationBus
    Properties:
      FunctionName: !GetAtt LifecycleLambda.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LifecycleEventRule.Arn

Outputs:
  Neo4jBoltEndpoint:
    Description: Neo4j Bolt URI for all participants
    Value: !Sub "bolt://${Neo4jNLB.DNSName}:7687"

  Neo4jUser:
    Description: Neo4j username
    Value: neo4j

  BuildLogs:
    Description: CloudWatch logs for graph build task
    Value: !Sub "https://console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#logGroups:group=/ecs/${AWS::StackName}/build"

  GraphDumpBucket:
    Description: S3 bucket storing Neo4j dump file
    Value: !Ref GraphDumpBucket
