AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Neo4j Service — NLB + single Fargate task that restores from S3 dump and serves.
  NLB provides a stable DNS endpoint across task restarts.
  Works for AWS events (centralAccountInfrastructure) and self-paced workshops.

Parameters:
  FoundationStack:
    Type: String
    Description: Name of the neo4j-foundation stack (to import outputs)
  SubnetId1:
    Type: String
    Description: First public subnet (NLB + task)
  SubnetId2:
    Type: String
    Description: Second public subnet (NLB only, for AZ redundancy)
  VpcId:
    Type: String
  Neo4jCpu:
    Type: String
    Default: "2048"
  Neo4jMemory:
    Type: String
    Default: "4096"

Resources:

  Neo4jTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-neo4j"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: !Ref Neo4jCpu
      Memory: !Ref Neo4jMemory
      EphemeralStorage:
        SizeInGiB: 21
      ExecutionRoleArn:
        Fn::ImportValue: !Sub "${FoundationStack}-Neo4jExecutionRoleArn"
      TaskRoleArn:
        Fn::ImportValue: !Sub "${FoundationStack}-Neo4jTaskRoleArn"
      Volumes:
        - Name: dump-volume
      ContainerDefinitions:

        # Sidecar: downloads dump from S3, then exits. Neo4j waits for SUCCESS.
        - Name: dump-downloader
          Image: amazon/aws-cli:latest
          Essential: false
          EntryPoint: ["/bin/sh", "-c"]
          Environment:
            - Name: DUMP_BUCKET
              Value:
                Fn::ImportValue: !Sub "${FoundationStack}-GraphDumpBucketName"
          MountPoints:
            - SourceVolume: dump-volume
              ContainerPath: /dump
          Command:
            - |
              echo "Downloading dump from S3..."
              aws s3 cp "s3://$DUMP_BUCKET/neo4j-graph.dump" /dump/neo4j-graph.dump
              echo "Dump ready."
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub "${FoundationStack}-Neo4jLogGroupName"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: downloader

        - Name: neo4j
          Image: neo4j:2026.01-enterprise-trixie
          Essential: true
          DependsOn:
            - ContainerName: dump-downloader
              Condition: SUCCESS
          PortMappings:
            - ContainerPort: 7687
              Protocol: tcp
          MountPoints:
            - SourceVolume: dump-volume
              ContainerPath: /dump
          Environment:
            - Name: NEO4J_ACCEPT_LICENSE_AGREEMENT
              Value: "yes"
          Secrets:
            - Name: NEO4J_PASSWORD
              ValueFrom:
                Fn::ImportValue: !Sub "${FoundationStack}-Neo4jSecretArn"
          EntryPoint: ["/bin/bash", "-c"]
          Command:
            - |
              set -e
              echo "Loading database from dump..."
              chown -R neo4j:neo4j /var/lib/neo4j
              neo4j-admin database load neo4j \
                --from-stdin --overwrite-destination=true \
                < /dump/neo4j-graph.dump
              echo "Configuring listeners..."
              sed -i 's/^#*\s*server\.default_listen_address=.*/server.default_listen_address=0.0.0.0/' \
                /var/lib/neo4j/conf/neo4j.conf
              grep -q "^server.default_listen_address" /var/lib/neo4j/conf/neo4j.conf || \
                echo "server.default_listen_address=0.0.0.0" >> /var/lib/neo4j/conf/neo4j.conf
              echo "Setting password..."
              neo4j-admin dbms set-initial-password "$NEO4J_PASSWORD" 2>&1 || true
              echo "Starting Neo4j..."
              export NEO4J_AUTH="neo4j/$NEO4J_PASSWORD"
              exec neo4j console
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub "${FoundationStack}-Neo4jLogGroupName"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: neo4j

  Neo4jNLB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_91
            comment: Workshop NLB - access logging not required
    Properties:
      Name: !Sub "neo4j-${AWS::AccountId}"
      Scheme: internet-facing
      Type: network
      Subnets:
        - !Ref SubnetId1
        - !Ref SubnetId2

  Neo4jTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "neo4j-tg-${AWS::AccountId}"
      Protocol: TCP
      Port: 7687
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckProtocol: TCP
      HealthCheckPort: "7687"
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  Neo4jListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Neo4jNLB
      Protocol: TCP
      Port: 7687
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref Neo4jTargetGroup

  Neo4jService:
    Type: AWS::ECS::Service
    DependsOn: Neo4jListener
    Properties:
      ServiceName: !Sub "${AWS::StackName}-neo4j"
      Cluster:
        Fn::ImportValue: !Sub "${FoundationStack}-Neo4jClusterName"
      TaskDefinition: !Ref Neo4jTaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - Fn::ImportValue: !Sub "${FoundationStack}-Neo4jSecurityGroupId"
          Subnets:
            - !Ref SubnetId1
      LoadBalancers:
        - ContainerName: neo4j
          ContainerPort: 7687
          TargetGroupArn: !Ref Neo4jTargetGroup
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: false
          Rollback: false
        MinimumHealthyPercent: 0
        MaximumPercent: 100
      HealthCheckGracePeriodSeconds: 300

Outputs:
  Neo4jBoltEndpoint:
    Description: >
      Stable Bolt endpoint (NLB DNS). Copy to contentspec.yaml params and
      code-editor.yaml Neo4jExternalURI parameter.
    Value: !Sub "bolt://${Neo4jNLB.DNSName}:7687"
  Neo4jUser:
    Value: neo4j
  Neo4jSecretArn:
    Description: Copy to code-editor.yaml parameter Neo4jExternalSecretArn
    Value:
      Fn::ImportValue: !Sub "${FoundationStack}-Neo4jSecretArn"
