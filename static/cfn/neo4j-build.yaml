AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Neo4j Build — fires a one-shot ECS task to build the knowledge graph and dump
  it to S3. CFN completes immediately (fire-and-forget). EventBridge detects
  task completion and automatically deploys neo4j-service via CloudFormation.
  Deploy after neo4j-foundation. neo4j-service is created automatically.

Parameters:
  FoundationStack:
    Type: String
    Description: Name of the neo4j-foundation stack (to import outputs)
  SubnetId1:
    Type: String
    Description: First public subnet (build task + service task)
  SubnetId2:
    Type: String
    Description: Second public subnet (service NLB)
  VpcId:
    Type: String
    Description: VPC for the service NLB target group
  RepoUrl:
    Type: String
    Default: "https://github.com/neo4j-partners/sample-stop-ai-agent-hallucinations-workshop"
  HotelFaqsUrl:
    Type: String
    Default: ""
    Description: Direct URL to hotel-faqs.zip. Leave blank if bundled in repo.
  AssetsBucketName:
    Type: String
    Default: ""
  AssetsBucketPrefix:
    Type: String
    Default: ""
  Neo4jCpu:
    Type: String
    Default: "2048"
  Neo4jMemory:
    Type: String
    Default: "4096"

Resources:

  BuildTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-build"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: "2048"
      Memory: "4096"
      EphemeralStorage:
        SizeInGiB: 30
      ExecutionRoleArn:
        Fn::ImportValue: !Sub "${FoundationStack}-Neo4jExecutionRoleArn"
      TaskRoleArn:
        Fn::ImportValue: !Sub "${FoundationStack}-Neo4jTaskRoleArn"
      ContainerDefinitions:
        - Name: graph-builder
          Image: neo4j:2026.01-enterprise-trixie
          Essential: true
          Environment:
            - Name: DUMP_BUCKET
              Value:
                Fn::ImportValue: !Sub "${FoundationStack}-GraphDumpBucketName"
            - Name: ASSETS_BUCKET
              Value: !Ref AssetsBucketName
            - Name: ASSETS_PREFIX
              Value: !Ref AssetsBucketPrefix
            - Name: REPO_URL
              Value: !Ref RepoUrl
            - Name: HOTEL_FAQS_URL
              Value: !Ref HotelFaqsUrl
            - Name: AWS_REGION
              Value:
                Fn::ImportValue: !Sub "${FoundationStack}-BedrockRegion"
            - Name: OTEL_SDK_DISABLED
              Value: "true"
            - Name: NEO4J_ACCEPT_LICENSE_AGREEMENT
              Value: "yes"
          Secrets:
            - Name: NEO4J_PASSWORD
              ValueFrom:
                Fn::ImportValue: !Sub "${FoundationStack}-Neo4jSecretArn"
          EntryPoint: ["/bin/bash", "-c"]
          Command:
            - |
              set -e

              apt-get update -qq && apt-get install -y -qq python3-venv 2>/dev/null
              python3 -m venv /opt/venv
              /opt/venv/bin/pip install -q --upgrade pip
              /opt/venv/bin/pip install -q "boto3>=1.35.0"

              S3_GET() { /opt/venv/bin/python3 -c "import boto3; boto3.client('s3').download_file('$1','$2','$3')"; }
              S3_PUT() { /opt/venv/bin/python3 -c "import boto3; boto3.client('s3').upload_file('$1','$2','$3')"; }
              S3_EXISTS() { /opt/venv/bin/python3 -c "import boto3,sys; boto3.client('s3').head_object(Bucket='$1',Key='$2')" 2>/dev/null; }

              # ── Fast path: use pre-built dump from WS assets bucket (~1 min) ──
              ASSETS_DUMP_KEY="${ASSETS_PREFIX}neo4j-graph.dump"
              if [[ -n "$ASSETS_BUCKET" ]] && S3_EXISTS "$ASSETS_BUCKET" "$ASSETS_DUMP_KEY"; then
                echo "=== Pre-built dump found — skipping Bedrock build ==="
                S3_GET "$ASSETS_BUCKET" "$ASSETS_DUMP_KEY" /tmp/neo4j-graph.dump
                S3_PUT /tmp/neo4j-graph.dump "$DUMP_BUCKET" "neo4j-graph.dump"
                echo "=== Dump ready — build complete ==="
                exit 0
              fi

              # ── Slow path: build from scratch with Bedrock ────────────────────
              echo "=== No pre-built dump found — building knowledge graph ==="
              apt-get install -y -qq curl git unzip 2>/dev/null
              /opt/venv/bin/pip install -q "neo4j>=5.28.0" "neo4j-graphrag>=1.13.0" "python-dotenv"

              echo "=== Installing APOC plugin ==="
              NEO4J_VERSION=$(neo4j version | grep -oP '\d+\.\d+\.\d+' | head -1)
              curl -fsSL "https://github.com/neo4j/apoc/releases/download/${NEO4J_VERSION}/apoc-${NEO4J_VERSION}-core.jar" \
                -o /var/lib/neo4j/plugins/apoc-core.jar || \
              curl -fsSL "https://github.com/neo4j/apoc/releases/latest/download/apoc-core.jar" \
                -o /var/lib/neo4j/plugins/apoc-core.jar
              echo "dbms.security.procedures.unrestricted=apoc.*" >> /var/lib/neo4j/conf/neo4j.conf
              echo "dbms.security.procedures.allowlist=apoc.*" >> /var/lib/neo4j/conf/neo4j.conf

              echo "=== Starting Neo4j ==="
              neo4j-admin dbms set-initial-password "$NEO4J_PASSWORD"
              neo4j start
              for i in $(seq 1 30); do
                cypher-shell -u neo4j -p "$NEO4J_PASSWORD" "RETURN 1;" 2>/dev/null && break
                echo "Waiting for Neo4j... ($i/30)"
                sleep 5
              done
              echo "Neo4j ready"

              echo "=== Cloning workshop repo ==="
              git clone "$REPO_URL" /opt/workshop

              echo "=== Getting hotel FAQ data ==="
              FAQS_ZIP=""
              if [[ -n "$HOTEL_FAQS_URL" ]]; then
                curl -fL "$HOTEL_FAQS_URL" -o /tmp/hotel-faqs.zip && FAQS_ZIP="/tmp/hotel-faqs.zip" || true
              fi
              if [[ -z "$FAQS_ZIP" && -n "$ASSETS_BUCKET" ]]; then
                FAQS_KEY="${ASSETS_PREFIX}hotel-faqs.zip"
                echo "Looking for s3://$ASSETS_BUCKET/$FAQS_KEY ..."
                if S3_EXISTS "$ASSETS_BUCKET" "$FAQS_KEY"; then
                  S3_GET "$ASSETS_BUCKET" "$FAQS_KEY" /tmp/hotel-faqs.zip && FAQS_ZIP="/tmp/hotel-faqs.zip"
                  echo "Downloaded hotel-faqs.zip from assets bucket"
                else
                  echo "Not found in assets bucket"
                fi
              fi
              if [[ -z "$FAQS_ZIP" && -f /opt/workshop/assets/hotel-faqs.zip ]]; then
                FAQS_ZIP="/opt/workshop/assets/hotel-faqs.zip"
              fi
              if [[ -n "$FAQS_ZIP" ]]; then
                mkdir -p /opt/workshop/01-graphrag-demo/data
                unzip -o "$FAQS_ZIP" -d /opt/workshop/01-graphrag-demo/data/
                echo "$(ls /opt/workshop/01-graphrag-demo/data | wc -l) hotel FAQ files ready"
              else
                echo "ERROR: hotel-faqs.zip not found" && exit 1
              fi

              echo "=== Building knowledge graph ==="
              export NEO4J_URI="bolt://localhost:7687"
              export NEO4J_USER="neo4j"
              cd /opt/workshop/01-graphrag-demo
              sed -i 's/amazon\.nova-embed-text-v1:0/amazon.nova-2-multimodal-embeddings-v1:0/g' build_graph.py
              /opt/venv/bin/python build_graph.py

              echo "=== Dumping database to S3 ==="
              neo4j stop
              sleep 5
              neo4j-admin database dump neo4j --to-stdout > /tmp/neo4j-graph.dump
              S3_PUT /tmp/neo4j-graph.dump "$DUMP_BUCKET" "neo4j-graph.dump"

              if [[ -n "$ASSETS_BUCKET" ]]; then
                echo "=== Saving dump to assets bucket for future fast deploys ==="
                S3_PUT /tmp/neo4j-graph.dump "$ASSETS_BUCKET" "$ASSETS_DUMP_KEY"
              fi
              echo "=== Build complete ==="
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub "${FoundationStack}-BuildLogGroupName"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: build

  # ── Fire-and-forget trigger ──────────────────────────────────────────────────
  # Lambda launches the ECS build task and returns SUCCESS to CFN immediately.
  # CFN does NOT wait for the build. EventBridge detects task completion and
  # creates neo4j-service-<stackname> automatically.

  BuildTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: RunECSTask
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ecs:RunTask, ecs:StopTask, ecs:ListTasks, iam:PassRole]
                Resource: "*"
              - Effect: Allow
                Action: [ssm:PutParameter, ssm:DeleteParameter]
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/workshop/${AWS::StackName}/task-arn"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/workshop/${AWS::StackName}/service-template"

  BuildTriggerLambda:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Build trigger Lambda does not need VPC
          - id: W92
            reason: One-time trigger Lambda
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt BuildTriggerRole.Arn
      Timeout: 60
      Environment:
        Variables:
          CLUSTER:
            Fn::ImportValue: !Sub "${FoundationStack}-Neo4jClusterName"
          TASK_DEF: !Ref BuildTaskDefinition
          SUBNET: !Ref SubnetId1
          SG:
            Fn::ImportValue: !Sub "${FoundationStack}-Neo4jSecurityGroupId"
          TASK_ARN_PARAM: !Sub "/workshop/${AWS::StackName}/task-arn"
      Code:
        ZipFile: |
          import boto3, os, json, urllib3

          def send(url, status, physical_id, stack_id, req_id, logical_id, data={}):
              body = json.dumps({
                  'Status': status,
                  'PhysicalResourceId': physical_id,
                  'StackId': stack_id,
                  'RequestId': req_id,
                  'LogicalResourceId': logical_id,
                  'Data': data,
              })
              urllib3.PoolManager().request('PUT', url,
                  body=body, headers={'Content-Type': ''})

          def handler(event, context):
              physical_id = event.get('PhysicalResourceId', event['LogicalResourceId'])
              if event['RequestType'] == 'Delete':
                  try:
                      boto3.client('ssm').delete_parameter(Name=os.environ['TASK_ARN_PARAM'])
                  except Exception:
                      pass
                  send(event['ResponseURL'], 'SUCCESS', physical_id,
                       event['StackId'], event['RequestId'], event['LogicalResourceId'])
                  return
              try:
                  ecs = boto3.client('ecs')
                  resp = ecs.run_task(
                      cluster=os.environ['CLUSTER'],
                      taskDefinition=os.environ['TASK_DEF'],
                      launchType='FARGATE',
                      networkConfiguration={
                          'awsvpcConfiguration': {
                              'subnets': [os.environ['SUBNET']],
                              'securityGroups': [os.environ['SG']],
                              'assignPublicIp': 'ENABLED',
                          }
                      },
                  )
                  task_arn = resp['tasks'][0]['taskArn']
                  print(f"Build task started: {task_arn}")
                  boto3.client('ssm').put_parameter(
                      Name=os.environ['TASK_ARN_PARAM'],
                      Value=task_arn,
                      Type='String',
                      Overwrite=True,
                  )
                  # Return SUCCESS immediately — CFN does not wait for the build task
                  send(event['ResponseURL'], 'SUCCESS', task_arn,
                       event['StackId'], event['RequestId'], event['LogicalResourceId'],
                       {'TaskArn': task_arn})
              except Exception as e:
                  print(f"Error starting build task: {e}")
                  send(event['ResponseURL'], 'FAILED', physical_id,
                       event['StackId'], event['RequestId'], event['LogicalResourceId'],
                       {'Error': str(e)})

  # ── EventBridge → Lambda → CloudFormation create-stack ──────────────────────
  # Fires when the build ECS task family stops. If exit code == 0, automatically
  # creates the neo4j-service stack. If exit code != 0, logs the error.

  ServiceLauncherRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LaunchServiceStack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:DescribeStacks
                  - iam:PassRole
                  - ssm:GetParameter
                Resource: "*"

  ServiceLauncherLambda:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Service launcher Lambda does not need VPC
          - id: W92
            reason: Event-driven Lambda
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ServiceLauncherRole.Arn
      Timeout: 60
      Environment:
        Variables:
          CLUSTER_ARN:
            Fn::ImportValue: !Sub "${FoundationStack}-Neo4jClusterArn"
          BUILD_STACK: !Ref AWS::StackName
          FOUNDATION_STACK: !Ref FoundationStack
          SUBNET_ID1: !Ref SubnetId1
          SUBNET_ID2: !Ref SubnetId2
          VPC_ID: !Ref VpcId
          NEO4J_CPU: !Ref Neo4jCpu
          NEO4J_MEMORY: !Ref Neo4jMemory
          TASK_ARN_PARAM: !Sub "/workshop/${AWS::StackName}/task-arn"
          SERVICE_TEMPLATE_URL: !Sub "https://${AssetsBucketName}.s3.${AWS::Region}.amazonaws.com/cfn/neo4j-service.yaml"
      Code:
        ZipFile: |
          import boto3, os, json

          def handler(event, context):
              detail = event.get('detail', {})
              task_arn = detail.get('taskArn', '')
              cluster_arn = detail.get('clusterArn', '')

              if os.environ['CLUSTER_ARN'] != cluster_arn:
                  print(f"Ignoring task from different cluster: {cluster_arn}")
                  return

              ssm = boto3.client('ssm')
              try:
                  stored_arn = ssm.get_parameter(Name=os.environ['TASK_ARN_PARAM'])['Parameter']['Value']
                  if stored_arn != task_arn:
                      print(f"Task ARN mismatch — ignoring")
                      return
              except ssm.exceptions.ParameterNotFound:
                  print("No stored task ARN — ignoring")
                  return

              containers = detail.get('containers', [])
              exit_code = containers[0].get('exitCode') if containers else None
              stop_reason = detail.get('stoppedReason', '')
              print(f"Build task {task_arn} stopped. Exit: {exit_code}. Reason: {stop_reason}")

              if exit_code != 0:
                  print(f"ERROR: Build task failed (exit {exit_code}). Service stack NOT created.")
                  return

              service_stack = f"neo4j-service-{os.environ['BUILD_STACK']}"
              print(f"Build succeeded — creating service stack: {service_stack}")
              cfn = boto3.client('cloudformation')
              try:
                  cfn.create_stack(
                      StackName=service_stack,
                      TemplateURL=os.environ['SERVICE_TEMPLATE_URL'],
                      Parameters=[
                          {'ParameterKey': 'FoundationStack',  'ParameterValue': os.environ['FOUNDATION_STACK']},
                          {'ParameterKey': 'SubnetId1',        'ParameterValue': os.environ['SUBNET_ID1']},
                          {'ParameterKey': 'SubnetId2',        'ParameterValue': os.environ['SUBNET_ID2']},
                          {'ParameterKey': 'VpcId',            'ParameterValue': os.environ['VPC_ID']},
                          {'ParameterKey': 'Neo4jCpu',         'ParameterValue': os.environ['NEO4J_CPU']},
                          {'ParameterKey': 'Neo4jMemory',      'ParameterValue': os.environ['NEO4J_MEMORY']},
                      ],
                      Capabilities=['CAPABILITY_IAM'],
                      OnFailure='ROLLBACK',
                  )
                  print(f"Service stack creation initiated: {service_stack}")
              except cfn.exceptions.AlreadyExistsException:
                  print(f"Service stack {service_stack} already exists — skipping")

  BuildTaskEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "neo4j-build-done-${AWS::AccountId}"
      EventPattern:
        source: [aws.ecs]
        detail-type: ["ECS Task State Change"]
        detail:
          clusterArn:
            - Fn::ImportValue: !Sub "${FoundationStack}-Neo4jClusterArn"
          lastStatus: [STOPPED]
          group: [!Sub "family:${AWS::StackName}-build"]
      Targets:
        - Id: ServiceLauncherTarget
          Arn: !GetAtt ServiceLauncherLambda.Arn

  ServiceLauncherPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ServiceLauncherLambda.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt BuildTaskEventRule.Arn

  # CFN completes immediately after the build task is launched.
  GraphBuildTrigger:
    Type: Custom::GraphBuildTrigger
    DependsOn:
      - BuildTaskDefinition
      - ServiceLauncherPermission
    Properties:
      ServiceToken: !GetAtt BuildTriggerLambda.Arn
      TriggerVersion: "1"

Outputs:
  BuildLogs:
    Description: CloudWatch logs for the graph build task
    Value: !Sub "https://console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#logGroups:group=/ecs/${FoundationStack}/build"
  ServiceStackName:
    Description: Name of the service stack that will be auto-created when build completes
    Value: !Sub "neo4j-service-${AWS::StackName}"
