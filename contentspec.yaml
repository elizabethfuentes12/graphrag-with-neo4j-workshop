version: 2.0
defaultLocaleCode: en-US
localeCodes:
  - en-US
  - es-US
  - pt-BR

params:
  workshopRepo: "https://github.com/neo4j-partners/sample-stop-ai-agent-hallucinations-workshop"

awsAccountConfig:
  accountSources:
    - workshop_studio

  serviceLinkedRoles:
    - lambda.amazonaws.com

  participantRole:
    iamPolicies:
      - static/iam_policy.json
    # No managed policy for Bedrock — permissions scoped in custom iam_policy.json
    trustedPrincipals:
      service:
        - lambda.amazonaws.com
        - bedrock-agentcore.amazonaws.com

  regionConfiguration:
    minAccessibleRegions: 1
    maxAccessibleRegions: 2
    accessibleRegions:
      required:
        - us-east-1
      optional:
        - us-west-2
    # us-east-1 required: Amazon Nova 2 Multimodal Embeddings (Module 1 Graph-RAG)
    # and Bedrock AgentCore (Module 6) are only available in us-east-1.
    # us-west-2 optional for content resiliency.
    deployableRegions:
      required:
        - us-east-1

infrastructure:
  cloudformationTemplates:
    - templateLocation: static/cfn/code-editor.yaml
      label: CodeEditor
      participantVisibleStackOutputs:
        - CodeEditorURL
        - Neo4jURI
        - Neo4jUser
        - Neo4jPassword
        - Neo4jHost
        - SecurityGroupId
        - SubnetIds
        - Neo4jPasswordSecretArn
      parameters:
        - templateParameter: InstanceType
          defaultValue: m6g.large
        - templateParameter: InstanceVolumeSize
          defaultValue: "40"
        - templateParameter: HomeFolder
          defaultValue: /Workshop
        - templateParameter: InstanceOperatingSystem
          defaultValue: AmazonLinux-2023
        - templateParameter: RepoUrl
          defaultValue: "https://github.com/neo4j-partners/sample-stop-ai-agent-hallucinations-workshop"
        - templateParameter: AssetsBucketName
          defaultValue: "{{.AssetsBucketName}}"
        - templateParameter: AssetsBucketPrefix
          defaultValue: "{{.AssetsBucketPrefix}}"
